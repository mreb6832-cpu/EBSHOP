 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment | EBSHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    .payment-box {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .summary {
      background: #f3f4f6;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      border-top: 1px solid #d1d5db;
      padding-top: 15px;
      margin-top: 15px;
    }

    .methods {
      display: grid;
      gap: 12px;
      margin-bottom: 25px;
    }

    .method {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .method:hover {
      border-color: #111827;
    }

    .method.selected {
      border-color: #111827;
      background: #f9fafb;
    }

    .method input {
      margin-right: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛒 EBSHOP</div>
  <a class="back" href="index.html">← Back to shop</a>
</header>

<div class="container">

  <div class="payment-box">

    <h1>Complete your payment</h1>

    <p class="subtitle">
      Choose your payment method and continue securely.
    </p>

    <div class="summary">

      <div class="summary-row">
        <span>Product</span>
        <strong id="productName">EBSHOP Product</strong>
      </div>

      <div class="summary-row">
        <span>Quantity</span>
        <strong id="quantity">1</strong>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <strong id="total">0 SEK</strong>
      </div>

    </div>

    <h3 style="margin-bottom: 15px;">Payment method</h3>

    <div class="methods">

      <label class="method selected">
        <input
          type="radio"
          name="paymentMethod"
          value="card"
          checked
        >
        💳 Card
      </label>

      <label class="method">
        <input
          type="radio"
          name="paymentMethod"
          value="swish"
        >
        📱 Swish
      </label>

    </div>

    <button id="payButton">
      Continue to secure payment
    </button>

    <div id="message"></div>

  </div>

</div>

<script type="module">

  const SUPABASE_FUNCTION_URL =
    "https://pniivrnhhghaalrmlquo.supabase.co/functions/v1/create-checkout";

  const productNameElement =
    document.getElementById("productName");

  const quantityElement =
    document.getElementById("quantity");

  const totalElement =
    document.getElementById("total");

  const payButton =
    document.getElementById("payButton");

  const message =
    document.getElementById("message");

  /*
    Get checkout information from URL.

    Example:

    payment.html?product=Shoes&price=299&quantity=1
  */

  const params = new URLSearchParams(
    window.location.search
  );

  const productName =
    params.get("product") || "EBSHOP Product";

  const price =
    Number(params.get("price")) || 0;

  const quantity =
    Number(params.get("quantity")) || 1;

  productNameElement.textContent =
    productName;

  quantityElement.textContent =
    quantity;

  const total =
    price * quantity;

  totalElement.textContent =
    total.toFixed(2) + " SEK";


  /*
    Payment method selection
  */

  const methods =
    document.querySelectorAll(".method");

  methods.forEach(method => {

    method.addEventListener("click", () => {

      methods.forEach(item => {
        item.classList.remove("selected");
      });

      method.classList.add("selected");

      const radio =
        method.querySelector("input");

      radio.checked = true;

    });

  });


  /*
    Start Stripe Checkout
  */

  payButton.addEventListener("click", async () => {

    if (total <= 0) {

      showMessage(
        "Invalid product price.",
        "error"
      );

      return;
    }

    const selected =
      document.querySelector(
        'input[name="paymentMethod"]:checked'
      );

    const paymentMethod =
      selected ? selected.value : "card";


    /*
      Current Edge Function supports
      real Stripe Card Checkout.

      Swish is not yet connected as a
      real Swish payment method.
    */

    if (paymentMethod === "swish") {

      showMessage(
        "Swish is not connected yet. Please choose Card for now.",
        "error"
      );

      return;
    }


    payButton.disabled = true;

    payButton.textContent =
      "Connecting to secure payment...";

    showMessage(
      "Opening secure Stripe Checkout...",
      "info"
    );


    try {

      const response =
        await fetch(
          SUPABASE_FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              amount: total,

              productName: productName,

              paymentMethod: paymentMethod

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to create payment."
        );

      }


      if (!data.url) {

        throw new Error(
          "Stripe Checkout URL was not returned."
        );

      }


      /*
        Send customer to Stripe
      */

      window.location.href =
        data.url;

    }

    catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Payment could not be started.",
        "error"
      );

      payButton.disabled = false;

      payButton.textContent =
        "Continue to secure payment";

    }

  });


  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";

  }

</script>

</body>
</html>
