```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment - EBSHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .payment-box {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 20px;
    }

    .order-summary {
      background: #f3f4f6;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .order-row:last-child {
      border-bottom: none;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
    }

    .methods {
      display: grid;
      gap: 15px;
      margin-top: 15px;
    }

    .method {
      border: 2px solid #ddd;
      padding: 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .method:hover {
      border-color: #111827;
    }

    .method input {
      margin-right: 10px;
    }

    .method strong {
      font-size: 17px;
    }

    .pay-button {
      width: 100%;
      padding: 16px;
      margin-top: 30px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:hover {
      background: #000;
    }

    .secure {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
        padding: 12px;
      }

      .payment-box {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ EBSHOP</h1>
    <p>Secure Checkout</p>
  </header>

  <div class="container">

    <div class="payment-box">

      <h2>Payment</h2>

      <div class="order-summary">
        <h3>Order Summary</h3>

        <div class="order-row">
          <span>Product</span>
          <span>100 SEK</span>
        </div>

        <div class="order-row">
          <span>Shipping</span>
          <span>0 SEK</span>
        </div>

        <div class="order-row total">
          <span>Total</span>
          <span>100 SEK</span>
        </div>
      </div>

      <h2>Choose payment method</h2>

      <div class="methods">

        <label class="method">
          <input type="radio" name="payment" value="card">
          <strong>💳 Card</strong>
          <p>Pay securely with your bank card.</p>
        </label>

        <label class="method">
          <input type="radio" name="payment" value="swish">
          <strong>📱 Swish</strong>
          <p>Pay using Swish.</p>
        </label>

        <label class="method">
          <input type="radio" name="payment" value="invoice">
          <strong>🧾 Invoice</strong>
          <p>Pay later using an invoice.</p>
        </label>

      </div>

      <button class="pay-button" onclick="startPayment()">
        Continue to Payment
      </button>

      <p class="secure">
        🔒 Your payment information is protected.
      </p>

    </div>

  </div>

  <script>
    function startPayment() {

      const selected = document.querySelector(
        'input[name="payment"]:checked'
      );

      if (!selected) {
        alert("Please choose a payment method.");
        return;
      }

      if (selected.value === "card") {
        alert("Card payment will be connected next.");
      }

      if (selected.value === "swish") {
        alert("Swish payment will be connected next.");
      }

      if (selected.value === "invoice") {
        alert("Invoice payment will be connected next.");
      }
    }
  </script>

</body>
</html>
```
