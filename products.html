<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | E&B SHOP</title>

  <meta
    name="description"
    content="Shop products from E&B SHOP in Sweden. Electronics, fashion, shoes, home, gaming, beauty and more."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: #111;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      min-height: 75px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo span {
      color: #d4af37;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #ddd;
      font-size: 14px;
    }

    nav a:hover {
      color: #d4af37;
    }

    .cart-btn {
      background: #d4af37;
      color: #000;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 700;
    }

    .cart-btn:hover {
      background: #f0cf55;
      color: #000;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 55px 20px 30px;
    }

    .hero small {
      color: #d4af37;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .hero h1 {
      font-size: 46px;
      margin: 10px 0;
    }

    .hero p {
      color: #aaa;
      max-width: 700px;
      line-height: 1.6;
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto 35px;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 230px;
    }

    .search-box input,
    .category-select {
      width: 100%;
      background: #151515;
      color: white;
      border: 1px solid #333;
      padding: 14px 16px;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    .search-box input:focus,
    .category-select:focus {
      border-color: #d4af37;
    }

    .category-wrap {
      width: 220px;
    }

    .products-section {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 70px;
    }

    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .section-top h2 {
      font-size: 25px;
    }

    #productCount {
      color: #999;
      font-size: 14px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.25s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #d4af37;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #1b1b1b;
    }

    .no-image {
      width: 100%;
      height: 220px;
      background: #1b1b1b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
      color: #777;
    }

    .product-info {
      padding: 17px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .category {
      color: #d4af37;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 18px;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .description {
      color: #999;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      margin-bottom: 14px;
      gap: 10px;
    }

    .price {
      color: #d4af37;
      font-size: 21px;
      font-weight: 800;
    }

    .stock {
      color: #8fd18f;
      font-size: 12px;
    }

    .out-stock {
      color: #ff7777;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      cursor: pointer;
      padding: 11px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      transition: .2s;
    }

    .details-btn {
      background: #252525;
      color: white;
      border: 1px solid #3a3a3a;
    }

    .details-btn:hover {
      color: #d4af37;
      border-color: #d4af37;
    }

    .add-btn {
      background: #d4af37;
      color: #000;
    }

    .add-btn:hover {
      background: #f0cf55;
    }

    .add-btn:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      grid-column: 1 / -1;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .empty h3 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .empty p {
      color: #999;
    }

    footer {
      border-top: 1px solid #292929;
      background: #101010;
      padding: 30px 20px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #d4af37;
      color: #000;
      padding: 14px 18px;
      border-radius: 9px;
      font-weight: 700;
      display: none;
      z-index: 9999;
    }

    @media (max-width: 1000px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 750px) {
      .navbar {
        flex-direction: column;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 36px;
      }

      .category-wrap {
        width: 100%;
      }
    }

    @media (max-width: 500px) {
      .product-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 30px;
      }

      .product-image,
      .no-image {
        height: 250px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="navbar">

    <a href="index.html" class="logo">
      🛒 <span>E&B</span> SHOP
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="account.html">My Account</a>
      <a href="orders.html">Orders</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>

      <a href="cart.html" class="cart-btn">
        🛒 Cart (<span id="cartCount">0</span>)
      </a>
    </nav>

  </div>
</header>


<main>

  <section class="hero">

    <small>E&B SHOP • SWEDEN 🇸🇪</small>

    <h1>All Products</h1>

    <p>
      Discover products available at E&B SHOP.
      Search and browse electronics, fashion, shoes,
      home products, gaming, beauty and more.
    </p>

  </section>


  <section class="controls">

    <div class="search-box">

      <input
        type="text"
        id="productSearch"
        placeholder="🔎 Search products..."
        autocomplete="off"
      >

    </div>


    <div class="category-wrap">

      <select id="categoryFilter" class="category-select">

        <option value="all">
          All Categories
        </option>

      </select>

    </div>

  </section>


  <section class="products-section">

    <div class="section-top">

      <h2>Shop Now</h2>

      <span id="productCount">
        0 products
      </span>

    </div>


    <div id="productGrid" class="product-grid"></div>

  </section>

</main>


<footer>
  © 2026 E&B SHOP — Sweden 🇸🇪
</footer>


<div id="toast" class="toast"></div>


<script>

  /*
   * E&B SHOP
   *
   * Products are stored in:
   * ebShopProducts
   *
   * This is the same storage used by admin.html.
   */


  const DEFAULT_PRODUCTS = [

    {
      id: "smartphone",
      name: "Smartphone",
      price: 4999,
      category: "Electronics",
      stock: 10,
      image: "",
      description: "Modern smartphone for everyday use."
    },

    {
      id: "sport-shoes",
      name: "Sport Shoes",
      price: 899,
      category: "Shoes",
      stock: 15,
      image: "",
      description: "Comfortable shoes for sport and everyday activities."
    },

    {
      id: "wireless-headphones",
      name: "Wireless Headphones",
      price: 699,
      category: "Electronics",
      stock: 20,
      image: "",
      description: "Wireless headphones with clear sound."
    },

    {
      id: "smart-watch",
      name: "Smart Watch",
      price: 1299,
      category: "Electronics",
      stock: 8,
      image: "",
      description: "Smart watch for notifications and daily activities."
    },

    {
      id: "fashion-bag",
      name: "Fashion Bag",
      price: 599,
      category: "Fashion",
      stock: 12,
      image: "",
      description: "Stylish everyday fashion bag."
    },

    {
      id: "home-air-fryer",
      name: "Air Fryer",
      price: 999,
      category: "Home",
      stock: 7,
      image: "",
      description: "Convenient air fryer for everyday meals."
    },

    {
      id: "gaming-controller",
      name: "Gaming Controller",
      price: 499,
      category: "Gaming",
      stock: 14,
      image: "",
      description: "Gaming controller for compatible devices."
    },

    {
      id: "beauty-products",
      name: "Beauty Products",
      price: 299,
      category: "Beauty",
      stock: 25,
      image: "",
      description: "Everyday beauty products."
    }

  ];


  const productGrid =
    document.getElementById("productGrid");

  const productSearch =
    document.getElementById("productSearch");

  const categoryFilter =
    document.getElementById("categoryFilter");

  const productCount =
    document.getElementById("productCount");

  const cartCount =
    document.getElementById("cartCount");

  const toast =
    document.getElementById("toast");


  let products = [];


  function loadProducts() {

    const saved =
      localStorage.getItem("ebShopProducts");


    if (!saved) {

      products = DEFAULT_PRODUCTS;

      saveProducts();

      return;
    }


    try {

      const parsed =
        JSON.parse(saved);


      if (Array.isArray(parsed)) {

        products = parsed;

      } else {

        products = DEFAULT_PRODUCTS;

        saveProducts();

      }

    } catch (error) {

      console.error(
        "Error loading products:",
        error
      );

      products = DEFAULT_PRODUCTS;

      saveProducts();

    }

  }


  function saveProducts() {

    localStorage.setItem(
      "ebShopProducts",
      JSON.stringify(products)
    );

  }


  function formatPrice(price) {

    return (
      Number(price || 0)
        .toLocaleString("sv-SE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })
      + " SEK"
    );

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function updateCartCount() {

    let cart = [];


    try {

      cart =
        JSON.parse(
          localStorage.getItem("ebShopCart") || "[]"
        );


      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch {

      cart = [];

    }


    const count =
      cart.reduce(
        (total, item) =>
          total + (Number(item.quantity) || 0),
        0
      );


    cartCount.textContent = count;

  }


  function getProductId(product) {

    if (product.id) {
      return String(product.id);
    }


    return String(product.name || "product")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");

  }


  function addToCart(id) {

    const product =
      products.find(
        item =>
          String(item.id) === String(id)
      );


    if (!product) {

      showToast("Product not found.");

      return;
    }


    const stock =
      Number(product.stock) || 0;


    if (stock <= 0) {

      showToast("This product is out of stock.");

      return;
    }


    let cart = [];


    try {

      cart =
        JSON.parse(
          localStorage.getItem("ebShopCart") || "[]"
        );


      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch {

      cart = [];

    }


    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(product.id)
      );


    if (existing) {

      const quantity =
        Number(existing.quantity) || 0;


      if (quantity >= stock) {

        showToast(
          "You cannot add more than available stock."
        );

        return;
      }


      existing.quantity =
        quantity + 1;

    } else {

      cart.push({

        id: product.id,

        name: product.name,

        price:
          Number(product.price) || 0,

        quantity: 1

      });

    }


    localStorage.setItem(
      "ebShopCart",
      JSON.stringify(cart)
    );


    updateCartCount();

    showToast(
      product.name + " added to cart!"
    );

  }


  function viewProduct(id) {

    window.location.href =
      "product-details.html?product=" +
      encodeURIComponent(id);

  }


  function showToast(message) {

    toast.textContent = message;

    toast.style.display = "block";


    clearTimeout(window.toastTimer);


    window.toastTimer =
      setTimeout(() => {

        toast.style.display = "none";

      }, 2500);

  }


  function loadCategories() {

    const categories =
      [
        ...new Set(
          products
            .map(
              product =>
                String(
                  product.category || ""
                ).trim()
            )
            .filter(Boolean)
        )
      ].sort();


    categoryFilter.innerHTML =
      '<option value="all">All Categories</option>';


    categories.forEach(category => {

      const option =
        document.createElement("option");


      option.value = category;

      option.textContent = category;


      categoryFilter.appendChild(option);

    });

  }


  function getFilteredProducts() {

    const searchTerm =
      productSearch.value
        .trim()
        .toLowerCase();


    const selectedCategory =
      categoryFilter.value;


    return products.filter(product => {

      const name =
        String(
          product.name || ""
        ).toLowerCase();


      const category =
        String(
          product.category || ""
        ).toLowerCase();


      const description =
        String(
          product.description || ""
        ).toLowerCase();


      const matchesSearch =
        !searchTerm ||
        name.includes(searchTerm) ||
        category.includes(searchTerm) ||
        description.includes(searchTerm);


      const matchesCategory =
        selectedCategory === "all" ||
        String(product.category || "") ===
          selectedCategory;


      return (
        matchesSearch &&
        matchesCategory
      );

    });

  }


  function renderProducts() {

    const filtered =
      getFilteredProducts();


    productCount.textContent =
      filtered.length +
      (
        filtered.length === 1
          ? " product"
          : " products"
      );


    if (filtered.length === 0) {

      productGrid.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🛍️
          </div>

          <h3>
            No products found
          </h3>

          <p>
            Try another search or category.
          </p>

        </div>

      `;

      return;
    }


    productGrid.innerHTML =
      filtered.map(product => {

        const id =
          getProductId(product);


        const name =
          escapeHtml(
            product.name ||
            "Unnamed Product"
          );


        const category =
          escapeHtml(
            product.category ||
            "Other"
          );


        const description =
          escapeHtml(
            product.description ||
            "Discover this product at E&B SHOP."
          );


        const price =
          formatPrice(product.price);


        const stock =
          Number(product.stock) || 0;


        let imageHTML;


        if (product.image) {

          imageHTML = `

            <img
              class="product-image"
              src="${escapeHtml(product.image)}"
              alt="${name}"
              loading="lazy"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >

            <div
              class="no-image"
              style="display:none;"
            >
              🛍️
            </div>

          `;

        } else {

          imageHTML = `

            <div class="no-image">
              🛍️
            </div>

          `;

        }


        const stockHTML =
          stock > 0

            ? `
              <span class="stock">
                ✓ ${stock} in stock
              </span>
            `

            : `
              <span class="stock out-stock">
                Out of stock
              </span>
            `;


        const disabled =
          stock <= 0
            ? "disabled"
            : "";


        return `

          <article class="product-card">

            ${imageHTML}

            <div class="product-info">

              <div class="category">
                ${category}
              </div>

              <h3 class="product-name">
                ${name}
              </h3>

              <p class="description">
                ${description}
              </p>

              <div class="price-row">

                <span class="price">
                  ${price}
                </span>

                ${stockHTML}

              </div>

              <div class="buttons">

                <button
                  class="btn details-btn"
                  onclick="viewProduct('${escapeHtml(id)}')"
                >
                  View
                </button>

                <button
                  class="btn add-btn"
                  ${disabled}
                  onclick="addToCart('${escapeHtml(id)}')"
                >
                  ${
                    stock > 0
                      ? "Add to Cart"
                      : "Out of Stock"
                  }
                </button>

              </div>

            </div>

          </article>

        `;

      }).join("");

  }


  productSearch.addEventListener(
    "input",
    renderProducts
  );


  categoryFilter.addEventListener(
    "change",
    renderProducts
  );


  window.addEventListener(
    "storage",
    event => {

      if (
        event.key === "ebShopProducts" ||
        event.key === "ebShopCart"
      ) {

        loadProducts();

        loadCategories();

        renderProducts();

        updateCartCount();

      }

    }
  );


  loadProducts();

  loadCategories();

  renderProducts();

  updateCartCount();

</script>

</body>
</html>
