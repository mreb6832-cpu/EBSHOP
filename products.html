<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products — E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    /* HEADER */
    header {
      background: #111;
      color: white;
      padding: 16px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #d4af37;
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #d4af37;
    }

    .cart-link {
      background: #d4af37;
      color: #111 !important;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
    }

    #cartCount {
      margin-left: 4px;
    }

    /* HERO */
    .hero {
      padding: 45px 6% 30px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #666;
      font-size: 16px;
    }

    /* CONTROLS */
    .controls {
      padding: 25px 6%;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      background: #f7f7f7;
    }

    .search-box,
    .category-select {
      height: 46px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      padding: 0 15px;
    }

    .search-box:focus,
    .category-select:focus {
      border-color: #d4af37;
    }

    .category-select {
      min-width: 190px;
      padding: 0 12px;
    }

    /* RESULTS INFO */
    .results-info {
      padding: 0 6% 20px;
      color: #666;
      font-size: 14px;
    }

    #resultCount {
      color: #111;
      font-weight: 700;
    }

    /* PRODUCT GRID */
    .product-grid {
      padding: 0 6% 50px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .image-wrapper {
      height: 220px;
      background: #f1f1f1;
      position: relative;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: #aaa;
    }

    .category-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #111;
      color: white;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .out-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #111;
      color: white;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
    }

    .product-content {
      padding: 18px;
    }

    .product-content h3 {
      font-size: 18px;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .description {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
      margin-bottom: 12px;
    }

    .price {
      color: #111;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stock {
      font-size: 13px;
      color: #16803c;
      margin-bottom: 15px;
    }

    .out-stock-text {
      color: #777;
    }

    .product-buttons {
      display: flex;
      gap: 8px;
    }

    .view-btn,
    .cart-add-btn {
      flex: 1;
      min-height: 40px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-btn {
      background: #111;
      color: white;
      border: 1px solid #111;
    }

    .view-btn:hover {
      background: #333;
    }

    .cart-add-btn {
      background: #d4af37;
      color: #111;
      border: 1px solid #d4af37;
    }

    .cart-add-btn:hover:not(:disabled) {
      background: #c29f27;
    }

    .cart-add-btn:disabled {
      background: #ddd;
      border-color: #ddd;
      color: #777;
      cursor: not-allowed;
    }

    /* EMPTY / ERROR */
    .empty-state {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 60px 20px;
      text-align: center;
    }

    .empty-state .icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .empty-state h2 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    .empty-state p {
      color: #666;
    }

    /* TOAST */
    #toast {
      display: none;
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #111;
      color: white;
      padding: 13px 18px;
      border-radius: 9px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      z-index: 9999;
      font-size: 14px;
    }

    /* FOOTER */
    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px;
      margin-top: 20px;
      font-size: 13px;
    }

    footer strong {
      color: #d4af37;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      header {
        padding: 14px 4%;
      }

      nav {
        gap: 9px;
      }

      nav a:not(.cart-link) {
        display: none;
      }

      .hero {
        padding: 35px 4% 25px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .controls {
        padding: 20px 4%;
      }

      .results-info {
        padding: 0 4% 18px;
      }

      .product-grid {
        padding: 0 4% 40px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .image-wrapper {
        height: 170px;
      }

      .product-content {
        padding: 12px;
      }

      .product-content h3 {
        font-size: 15px;
      }

      .description {
        font-size: 12px;
      }

      .price {
        font-size: 17px;
      }

      .product-buttons {
        flex-direction: column;
      }

      #toast {
        left: 15px;
        right: 15px;
        bottom: 15px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo">E&B SHOP</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="account.html">Account</a>

      <a href="cart.html" class="cart-link">
        🛒 Cart
        <span id="cartCount">0</span>
      </a>
    </nav>
  </header>


  <!-- HERO -->
  <section class="hero">
    <h1>Products</h1>
    <p>Discover products available at E&B SHOP.</p>
  </section>


  <!-- SEARCH / FILTER -->
  <section class="controls">

    <input
      type="search"
      id="productSearch"
      class="search-box"
      placeholder="Search products..."
      autocomplete="off"
    >

    <select
      id="categoryFilter"
      class="category-select"
    >
      <option value="all">All Categories</option>
    </select>

  </section>


  <!-- RESULT COUNT -->
  <div class="results-info">
    <span id="resultCount">0</span>
    products available
  </div>


  <!-- PRODUCTS -->
  <main
    id="productGrid"
    class="product-grid"
  >
    <div class="empty-state">
      <div class="icon">⏳</div>
      <h2>Loading Products...</h2>
      <p>Please wait.</p>
    </div>
  </main>


  <!-- TOAST -->
  <div id="toast"></div>


  <!-- FOOTER -->
  <footer>
    © 2026 <strong>E&B SHOP</strong>. All rights reserved.
  </footer>


  <!-- SUPABASE + PRODUCTS SCRIPT -->
  <script type="module">

    import { supabase } from "./supabaseClient.js";

    const CART_KEY = "ebShopCart";

    const productGrid =
      document.getElementById("productGrid");

    const productSearch =
      document.getElementById("productSearch");

    const categoryFilter =
      document.getElementById("categoryFilter");

    const resultCount =
      document.getElementById("resultCount");

    const cartCount =
      document.getElementById("cartCount");

    const toast =
      document.getElementById("toast");

    let products = [];


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      productGrid.innerHTML = `
        <div class="empty-state">
          <div class="icon">⏳</div>
          <h2>Loading Products...</h2>
          <p>Please wait.</p>
        </div>
      `;

      try {

        const { data, error } = await supabase
          .from("products")
          .select("*")
          .order("created_at", {
            ascending: false
          });


        if (error) {

          console.error(
            "Could not load products:",
            error
          );

          products = [];

          productGrid.innerHTML = `
            <div class="empty-state">
              <div class="icon">⚠️</div>
              <h2>Could Not Load Products</h2>
              <p>${escapeHtml(error.message || "Please try again later.")}</p>
            </div>
          `;

          resultCount.textContent = "0";

          return;
        }


        products =
          Array.isArray(data)
            ? data
            : [];


        createCategories();

        filterProducts();

      }

      catch (error) {

        console.error(
          "Unexpected error:",
          error
        );

        products = [];

        productGrid.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h2>Something Went Wrong</h2>
            <p>${escapeHtml(error.message || "Please try again later.")}</p>
          </div>
        `;

        resultCount.textContent = "0";
      }
    }


    /* =========================
       CART COUNT
    ========================= */

    function updateCartCount() {

      let cart = [];

      try {

        cart = JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );

        if (!Array.isArray(cart)) {
          cart = [];
        }

      }

      catch {
        cart = [];
      }


      const count =
        cart.reduce(
          (total, item) =>
            total +
            (Number(item.quantity) || 0),
          0
        );


      cartCount.textContent = count;
    }


    /* =========================
       CATEGORIES
    ========================= */

    function createCategories() {

      const categories = [
        ...new Set(
          products
            .map(product => product.category)
            .filter(Boolean)
        )
      ].sort();


      categoryFilter.innerHTML = `
        <option value="all">
          All Categories
        </option>
      `;


      categories.forEach(category => {

        const option =
          document.createElement("option");

        option.value = category;

        option.textContent = category;

        categoryFilter.appendChild(option);

      });
    }


    /* =========================
       FILTER
    ========================= */

    function filterProducts() {

      const searchText =
        productSearch.value
          .trim()
          .toLowerCase();


      const selectedCategory =
        categoryFilter.value;


      const filtered =
        products.filter(product => {

          const name =
            String(product.name || "")
              .toLowerCase();


          const description =
            String(product.description || "")
              .toLowerCase();


          const category =
            String(product.category || "")
              .toLowerCase();


          const matchesSearch =
            !searchText ||
            name.includes(searchText) ||
            description.includes(searchText) ||
            category.includes(searchText);


          const matchesCategory =
            selectedCategory === "all" ||
            product.category === selectedCategory;


          return (
            matchesSearch &&
            matchesCategory
          );

        });


      renderProducts(filtered);
    }


    /* =========================
       RENDER
    ========================= */

    function renderProducts(list) {

      resultCount.textContent =
        list.length;


      if (list.length === 0) {

        productGrid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🛍️</div>
            <h2>No Products Found</h2>
            <p>
              There are currently no products matching your search.
            </p>
          </div>
        `;

        return;
      }


      productGrid.innerHTML =
        list
          .map(product =>
            createProductCard(product)
          )
          .join("");


      document
        .querySelectorAll(".product-image")
        .forEach(image => {

          image.addEventListener(
            "error",
            function () {

              this.style.display = "none";

              const fallback =
                this.nextElementSibling;

              if (fallback) {
                fallback.style.display = "flex";
              }

            }
          );

        });
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    function createProductCard(product) {

      const id =
        String(product.id || "");


      const name =
        escapeHtml(
          product.name ||
          "Unnamed Product"
        );


      const category =
        escapeHtml(
          product.category ||
          "Other"
        );


      const description =
        escapeHtml(
          product.description ||
          "No description available."
        );


      const price =
        formatPrice(product.price);


      const stock =
        Number(product.stock) || 0;


      let imageHTML;


      if (product.image) {

        imageHTML = `
          <img
            class="product-image"
            src="${escapeHtml(product.image)}"
            alt="${name}"
          >

          <div
            class="no-image"
            style="display:none;"
          >
            🛍️
          </div>
        `;

      }

      else {

        imageHTML = `
          <div class="no-image">
            🛍️
          </div>
        `;

      }


      const stockHTML =
        stock > 0

          ? `
            <div class="stock">
              ✓ ${stock} available
            </div>
          `

          : `
            <div class="stock out-stock-text">
              Out of stock
            </div>
          `;


      const outBadge =
        stock <= 0

          ? `
            <div class="out-badge">
              OUT OF STOCK
            </div>
          `

          : "";


      return `
        <article class="product-card">

          <div class="image-wrapper">

            ${imageHTML}

            <div class="category-badge">
              ${category}
            </div>

            ${outBadge}

          </div>


          <div class="product-content">

            <h3>
              ${name}
            </h3>


            <div class="description">
              ${description}
            </div>


            <div class="price">
              ${price}
            </div>


            ${stockHTML}


            <div class="product-buttons">

              <a
                href="product-details.html?product=${encodeURIComponent(id)}"
                class="view-btn"
              >
                View
              </a>


              <button
                type="button"
                class="cart-add-btn"
                data-product-id="${escapeHtml(id)}"
                ${stock <= 0 ? "disabled" : ""}
              >
                🛒 Add
              </button>

            </div>

          </div>

        </article>
      `;
    }


    /* =========================
       ADD TO CART
    ========================= */

    productGrid.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            ".cart-add-btn"
          );


        if (!button) {
          return;
        }


        const productId =
          button.dataset.productId;


        addToCart(productId);
      }
    );


    function addToCart(productId) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(productId)
        );


      if (!product) {

        showToast(
          "Product not found."
        );

        return;
      }


      const stock =
        Number(product.stock) || 0;


      if (stock <= 0) {

        showToast(
          "This product is out of stock."
        );

        return;
      }


      let cart = [];


      try {

        cart =
          JSON.parse(
            localStorage.getItem(
              CART_KEY
            ) || "[]"
          );


        if (!Array.isArray(cart)) {
          cart = [];
        }

      }

      catch {

        cart = [];

      }


      const existing =
        cart.find(
          item =>
            String(item.id) ===
            String(product.id)
        );


      if (existing) {

        const currentQuantity =
          Number(existing.quantity) || 0;


        if (
          currentQuantity >= stock
        ) {

          showToast(
            "You reached the available stock."
          );

          return;
        }


        existing.quantity =
          currentQuantity + 1;

      }

      else {

        cart.push({

          id: product.id,

          name: product.name,

          price:
            Number(product.price) || 0,

          quantity: 1

        });

      }


      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );


      updateCartCount();


      showToast(
        product.name +
        " added to cart!"
      );
    }


    /* =========================
       SEARCH
    ========================= */

    productSearch.addEventListener(
      "input",
      filterProducts
    );


    /* =========================
       CATEGORY
    ========================= */

    categoryFilter.addEventListener(
      "change",
      filterProducts
    );


    /* =========================
       PRICE
    ========================= */

    function formatPrice(price) {

      return (
        Number(price || 0)
          .toLocaleString(
            "sv-SE",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          )
        + " SEK"
      );
    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       TOAST
    ========================= */

    function showToast(text) {

      toast.textContent = text;

      toast.style.display = "block";


      clearTimeout(
        window.toastTimer
      );


      window.toastTimer =
        setTimeout(
          function() {

            toast.style.display =
              "none";

          },
          2500
        );
    }


    /* =========================
       START
    ========================= */

    updateCartCount();

    loadProducts();

  </script>

</body>
</html>
```
