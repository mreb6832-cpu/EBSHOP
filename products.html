<script type="module">
  import { supabase } from "./supabaseClient.js";

  const CART_KEY = "ebShopCart";

  const productGrid =
    document.getElementById("productGrid");

  const productSearch =
    document.getElementById("productSearch");

  const categoryFilter =
    document.getElementById("categoryFilter");

  const resultCount =
    document.getElementById("resultCount");

  const cartCount =
    document.getElementById("cartCount");

  const toast =
    document.getElementById("toast");

  let products = [];

  /*
   * LOAD PRODUCTS FROM SUPABASE
   */

  async function loadProducts() {
    productGrid.innerHTML = `
      <div class="empty-state">
        <div class="icon">⏳</div>
        <h2>Loading Products...</h2>
        <p>Please wait.</p>
      </div>
    `;

    try {
      const { data, error } = await supabase
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {
        console.error("Could not load products:", error);

        products = [];

        productGrid.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h2>Could Not Load Products</h2>
            <p>Please try again later.</p>
          </div>
        `;

        resultCount.textContent = "0";
        return;
      }

      products = Array.isArray(data)
        ? data
        : [];

      createCategories();
      filterProducts();

    } catch (error) {
      console.error("Unexpected error:", error);

      products = [];

      productGrid.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h2>Something Went Wrong</h2>
          <p>Please try again later.</p>
        </div>
      `;

      resultCount.textContent = "0";
    }
  }


  /*
   * UPDATE CART COUNT
   */

  function updateCartCount() {
    let cart = [];

    try {
      cart =
        JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch {
      cart = [];
    }

    const count =
      cart.reduce(
        (total, item) =>
          total +
          (Number(item.quantity) || 0),
        0
      );

    cartCount.textContent = count;
  }


  /*
   * CREATE CATEGORIES
   */

  function createCategories() {
    const categories = [
      ...new Set(
        products
          .map(
            product =>
              product.category
          )
          .filter(Boolean)
      )
    ].sort();

    categoryFilter.innerHTML = `
      <option value="all">
        All Categories
      </option>
    `;

    categories.forEach(category => {
      const option =
        document.createElement("option");

      option.value = category;
      option.textContent = category;

      categoryFilter.appendChild(option);
    });
  }


  /*
   * FILTER PRODUCTS
   */

  function filterProducts() {
    const searchText =
      productSearch.value
        .trim()
        .toLowerCase();

    const selectedCategory =
      categoryFilter.value;

    const filtered =
      products.filter(product => {
        const name =
          String(
            product.name || ""
          ).toLowerCase();

        const description =
          String(
            product.description || ""
          ).toLowerCase();

        const category =
          String(
            product.category || ""
          ).toLowerCase();

        const matchesSearch =
          !searchText ||
          name.includes(searchText) ||
          description.includes(searchText) ||
          category.includes(searchText);

        const matchesCategory =
          selectedCategory === "all" ||
          product.category === selectedCategory;

        return (
          matchesSearch &&
          matchesCategory
        );
      });

    renderProducts(filtered);
  }


  /*
   * RENDER PRODUCTS
   */

  function renderProducts(list) {
    resultCount.textContent =
      list.length;

    if (list.length === 0) {
      productGrid.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔎</div>

          <h2>
            No Products Found
          </h2>

          <p>
            Try another search or category.
          </p>
        </div>
      `;

      return;
    }

    productGrid.innerHTML =
      list
        .map(product =>
          createProductCard(product)
        )
        .join("");

    document
      .querySelectorAll(".product-image")
      .forEach(image => {
        image.addEventListener(
          "error",
          function () {
            this.style.display = "none";

            const fallback =
              this.nextElementSibling;

            if (fallback) {
              fallback.style.display = "flex";
            }
          }
        );
      });
  }


  /*
   * PRODUCT CARD
   */

  function createProductCard(product) {
    const id =
      String(product.id || "");

    const name =
      escapeHtml(
        product.name ||
        "Unnamed Product"
      );

    const category =
      escapeHtml(
        product.category ||
        "Other"
      );

    const description =
      escapeHtml(
        product.description ||
        "No description available."
      );

    const price =
      formatPrice(product.price);

    const stock =
      Number(product.stock) || 0;

    let imageHTML;

    if (product.image) {
      imageHTML = `
        <img
          class="product-image"
          src="${escapeHtml(product.image)}"
          alt="${name}"
        >

        <div
          class="no-image"
          style="display:none;"
        >
          🛍️
        </div>
      `;
    } else {
      imageHTML = `
        <div class="no-image">
          🛍️
        </div>
      `;
    }

    const stockHTML =
      stock > 0
        ? `
          <div class="stock">
            ✓ ${stock} available
          </div>
        `
        : `
          <div class="stock out-stock-text">
            Out of stock
          </div>
        `;

    const outBadge =
      stock <= 0
        ? `
          <div class="out-badge">
            OUT OF STOCK
          </div>
        `
        : "";

    return `
      <article class="product-card">

        <div class="image-wrapper">

          ${imageHTML}

          <div class="category-badge">
            ${category}
          </div>

          ${outBadge}

        </div>

        <div class="product-content">

          <h3>
            ${name}
          </h3>

          <div class="description">
            ${description}
          </div>

          <div class="price">
            ${price}
          </div>

          ${stockHTML}

          <div class="product-buttons">

            <a
              href="product-details.html?product=${encodeURIComponent(id)}"
              class="view-btn"
            >
              View
            </a>

            <button
              class="cart-add-btn"
              data-product-id="${escapeHtml(id)}"
              ${stock <= 0 ? "disabled" : ""}
            >
              🛒 Add
            </button>

          </div>

        </div>

      </article>
    `;
  }


  /*
   * ADD TO CART
   */

  productGrid.addEventListener(
    "click",
    function (event) {
      const button =
        event.target.closest(
          ".cart-add-btn"
        );

      if (!button) {
        return;
      }

      const productId =
        button.dataset.productId;

      addToCart(productId);
    }
  );


  function addToCart(productId) {
    const product =
      products.find(
        item =>
          String(item.id) ===
          String(productId)
      );

    if (!product) {
      showToast(
        "Product not found."
      );
      return;
    }

    const stock =
      Number(product.stock) || 0;

    if (stock <= 0) {
      showToast(
        "This product is out of stock."
      );
      return;
    }

    let cart = [];

    try {
      cart =
        JSON.parse(
          localStorage.getItem(
            CART_KEY
          ) || "[]"
        );

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch {
      cart = [];
    }

    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(product.id)
      );

    if (existing) {
      const currentQuantity =
        Number(existing.quantity) || 0;

      if (
        currentQuantity >= stock
      ) {
        showToast(
          "You reached the available stock."
        );
        return;
      }

      existing.quantity =
        currentQuantity + 1;

    } else {
      cart.push({
        id: product.id,
        name: product.name,
        price:
          Number(product.price) || 0,
        quantity: 1
      });
    }

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

    updateCartCount();

    showToast(
      product.name +
      " added to cart!"
    );
  }


  /*
   * SEARCH
   */

  productSearch.addEventListener(
    "input",
    filterProducts
  );


  /*
   * CATEGORY
   */

  categoryFilter.addEventListener(
    "change",
    filterProducts
  );


  /*
   * PRICE FORMAT
   */

  function formatPrice(price) {
    return (
      Number(price || 0)
        .toLocaleString(
          "sv-SE",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      + " SEK"
    );
  }


  /*
   * HTML SECURITY
   */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  /*
   * TOAST MESSAGE
   */

  function showToast(text) {
    toast.textContent = text;

    toast.style.display =
      "block";

    clearTimeout(
      window.toastTimer
    );

    window.toastTimer =
      setTimeout(
        function () {
          toast.style.display =
            "none";
        },
        2500
      );
  }


  /*
   * START
   */

  updateCartCount();

  loadProducts();
</script>
