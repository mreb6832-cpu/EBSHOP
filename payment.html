<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EB SHOP - Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #303030;
    }

    .payment-box {
      text-align: center;
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
    }

    .logo {
      font-size: 30px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: #777;
      margin-bottom: 30px;
    }

    .pay-button {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 8px;
      background: #0879d1;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .pay-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      color: #c62828;
      font-size: 14px;
    }

    .loading {
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="payment-box">

    <div class="logo">🛒</div>

    <h1>EB SHOP</h1>

    <p>Secure checkout</p>

    <button id="payButton" class="pay-button">
      Continue to Payment
    </button>

    <div id="loading" class="loading"></div>

    <div id="message" class="message"></div>

  </div>


  <script>
    const payButton = document.getElementById("payButton");
    const loading = document.getElementById("loading");
    const message = document.getElementById("message");

    const cart = JSON.parse(
      localStorage.getItem("ebShopCart") || "[]"
    );


    payButton.addEventListener("click", startPayment);


    async function startPayment() {

      if (!cart.length) {
        message.textContent = "Your cart is empty.";
        return;
      }

      payButton.disabled = true;
      payButton.textContent = "Opening secure checkout...";
      message.textContent = "";
      loading.textContent = "Connecting to Stripe...";


      try {

        const response = await fetch(
          "https://ebshop.vercel.app/api/create-checkout-session",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              items: cart
            })
          }
        );


        const data = await response.json();


        if (!response.ok || !data.url) {
          throw new Error(
            data.error ||
            "Could not create Stripe Checkout session."
          );
        }


        /*
          This opens the REAL Stripe-hosted
          checkout page.

          Stripe controls the payment UI,
          including available payment methods.
        */

        window.location.href = data.url;


      } catch (error) {

        console.error("Stripe error:", error);

        loading.textContent = "";

        message.textContent =
          error.message ||
          "Payment could not be started.";

        payButton.disabled = false;
        payButton.textContent = "Continue to Payment";
      }
    }
  </script>

</body>
</html>
