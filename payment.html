```html
<script type="module">

  import { supabase } from "./supabaseClient.js";

  const cartKey = "ebShopCart";

  const customerEmailEl = document.getElementById("customerEmail");
  const customerPhoneEl = document.getElementById("customerPhone");
  const orderItemsEl = document.getElementById("orderItems");
  const subtotalEl = document.getElementById("subtotal");
  const totalEl = document.getElementById("total");
  const itemCountEl = document.getElementById("itemCount");
  const payBtn = document.getElementById("payBtn");
  const errorBox = document.getElementById("errorBox");

  let selectedMethod = "card";
  let checkoutCart = [];


  /* =========================
     PAYMENT METHOD
  ========================= */

  document.querySelectorAll(".method").forEach(method => {

    method.addEventListener("click", () => {

      document.querySelectorAll(".method").forEach(item => {
        item.classList.remove("active");
      });

      method.classList.add("active");

      selectedMethod = method.dataset.method;

    });

  });


  /* =========================
     FORMAT SEK
  ========================= */

  function formatSEK(value) {

    return new Intl.NumberFormat("sv-SE", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(value) + " SEK";

  }


  /* =========================
     GET CART
  ========================= */

  function getCart() {

    try {

      const cart =
        JSON.parse(localStorage.getItem(cartKey));

      return Array.isArray(cart) ? cart : [];

    } catch (error) {

      console.error("Cart error:", error);

      return [];

    }

  }


  /* =========================
     CUSTOMER
  ========================= */

  async function loadCustomer() {

    const {
      data,
      error
    } = await supabase.auth.getUser();

    if (error || !data?.user) {

      window.location.href = "login.html";

      return null;

    }

    const user = data.user;

    customerEmailEl.textContent =
      user.email || "Not provided";

    const phone =
      user.user_metadata?.phone ||
      localStorage.getItem("ebShopCustomerPhone") ||
      "Not provided";

    customerPhoneEl.textContent = phone;

    return user;

  }


  /* =========================
     LOAD ORDER
  ========================= */

  async function loadOrder() {

    const cart = getCart();

    if (!cart.length) {

      orderItemsEl.innerHTML = `
        <div class="empty">
          Your cart is empty.
        </div>
      `;

      subtotalEl.textContent = "0 SEK";
      totalEl.textContent = "0 SEK";
      itemCountEl.textContent = "0 items";
      payBtn.disabled = true;

      return;

    }

    const ids = cart
      .map(item => item.id)
      .filter(Boolean);

    if (!ids.length) {

      orderItemsEl.innerHTML = `
        <div class="empty">
          Your cart contains invalid products.
        </div>
      `;

      payBtn.disabled = true;

      return;

    }

    const {
      data: products,
      error
    } = await supabase
      .from("products")
      .select("id,name,price,stock,image")
      .in("id", ids);

    if (error) {

      console.error("Products error:", error);

      orderItemsEl.innerHTML = `
        <div class="empty">
          Unable to load your order.
        </div>
      `;

      payBtn.disabled = true;

      return;

    }

    const validCart = [];

    let subtotal = 0;
    let totalQuantity = 0;

    orderItemsEl.innerHTML = "";

    for (const cartItem of cart) {

      const product = products.find(
        p =>
          String(p.id) ===
          String(cartItem.id)
      );

      if (!product) continue;

      const stock =
        Number(product.stock || 0);

      if (stock <= 0) continue;

      let quantity =
        Number(cartItem.quantity || 1);

      quantity =
        Math.min(quantity, stock);

      if (quantity <= 0) continue;

      const price =
        Number(product.price || 0);

      if (!Number.isFinite(price) || price < 0) {
        continue;
      }

      const lineTotal =
        price * quantity;

      subtotal += lineTotal;
      totalQuantity += quantity;

      validCart.push({
        id: product.id,
        quantity: quantity,
        name: product.name,
        price: price,
        image: product.image || ""
      });

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `
        ${
          product.image
            ? `
              <img
                class="item-image"
                src="${escapeHtml(product.image)}"
                alt="${escapeHtml(product.name)}"
              >
            `
            : `
              <div
                class="item-image"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:22px;
                "
              >
                📦
              </div>
            `
        }

        <div class="item-info">

          <div class="item-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="item-meta">
            Qty: ${quantity}
          </div>

        </div>

        <div class="item-price">
          ${formatSEK(lineTotal)}
        </div>
      `;

      orderItemsEl.appendChild(item);

    }

    checkoutCart = validCart;

    localStorage.setItem(
      cartKey,
      JSON.stringify(validCart)
    );

    subtotalEl.textContent =
      formatSEK(subtotal);

    totalEl.textContent =
      formatSEK(subtotal);

    itemCountEl.textContent =
      `${totalQuantity} ${
        totalQuantity === 1
          ? "item"
          : "items"
      }`;

    if (!validCart.length) {

      orderItemsEl.innerHTML = `
        <div class="empty">
          Your cart is empty.
        </div>
      `;

      payBtn.disabled = true;

    } else {

      payBtn.disabled = false;

    }

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     CREATE STRIPE LINE ITEMS
  ========================= */

  function createStripeLineItems(cart) {

    return cart.map(item => {

      const price =
        Number(item.price);

      const quantity =
        Number(item.quantity);

      if (
        !item.name ||
        !Number.isFinite(price) ||
        price < 0 ||
        !Number.isInteger(quantity) ||
        quantity < 1
      ) {
        throw new Error(
          "Invalid product information."
        );
      }

      return {

        price_data: {

          currency: "sek",

          product_data: {
            name: String(item.name)
          },

          unit_amount:
            Math.round(price * 100)

        },

        quantity: quantity

      };

    });

  }


  /* =========================
     START CHECKOUT
  ========================= */

  payBtn.addEventListener("click", async () => {

    errorBox.style.display = "none";
    errorBox.textContent = "";

    if (!checkoutCart.length) {

      errorBox.textContent =
        "Your cart is empty.";

      errorBox.style.display =
        "block";

      return;

    }

    payBtn.disabled = true;

    payBtn.textContent =
      "Opening secure checkout...";

    try {

      const {
        data,
        error
      } = await supabase.auth.getUser();

      if (error || !data?.user) {

        window.location.href =
          "login.html";

        return;

      }

      const user = data.user;

      /*
       * Convert our cart products into
       * Stripe Checkout line items.
       */

      const lineItems =
        createStripeLineItems(checkoutCart);

      console.log(
        "Stripe line items:",
        lineItems
      );

      const response = await fetch(
        "/api/create-checkout-session",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            lineItems: lineItems,

            customerEmail:
              user.email || "",

            customerPhone:
              user.user_metadata?.phone ||
              localStorage.getItem(
                "ebShopCustomerPhone"
              ) ||
              "",

            paymentMethod:
              selectedMethod

          })
        }
      );

      const responseText =
        await response.text();

      let result;

      try {

        result =
          JSON.parse(responseText);

      } catch {

        throw new Error(
          `Checkout server error (${response.status}): ${responseText.slice(0, 500)}`
        );

      }

      if (!response.ok) {

        throw new Error(
          result?.error ||
          `Checkout server returned ${response.status}.`
        );

      }

      if (!result?.url) {

        throw new Error(
          "Stripe checkout URL was not returned."
        );

      }

      /*
       * Send customer to Stripe Checkout.
       */

      window.location.href =
        result.url;

    } catch (error) {

      console.error(
        "Checkout error:",
        error
      );

      errorBox.textContent =
        error.message ||
        "Something went wrong. Please try again.";

      errorBox.style.display =
        "block";

      payBtn.disabled = false;

      payBtn.textContent =
        "Continue to Payment";

    }

  });


  /* =========================
     INITIALIZE
  ========================= */

  await loadCustomer();

  await loadOrder();

</script>
```
