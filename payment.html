<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment - EB SHOP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    .container {
      width: min(700px, 92%);
      margin: 50px auto;
    }

    .box {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    h1 {
      margin-top: 0;
      color: #d4af37;
      text-align: center;
    }

    .total-box {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin: 25px 0;
      text-align: center;
    }

    .total-label {
      color: #aaa;
      font-size: 14px;
    }

    .total {
      font-size: 32px;
      font-weight: bold;
      color: #d4af37;
      margin-top: 6px;
    }

    .method {
      margin-top: 22px;
      padding: 20px;
      background: #101010;
      border: 1px solid #303030;
      border-radius: 14px;
    }

    .method h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    .stripe-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #d4af37;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .stripe-btn:hover {
      opacity: .9;
    }

    #paypal-button-container {
      margin-top: 10px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #777;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #333;
      flex: 1;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #d4af37;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    .error {
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
    }
  </style>

  <!-- PayPal Sandbox SDK -->
  <script src="https://www.sandbox.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=SEK&components=buttons"></script>
</head>

<body>

  <div class="container">
    <div class="box">

      <h1>Choose Payment Method</h1>

      <div class="total-box">
        <div class="total-label">Order Total</div>
        <div class="total" id="orderTotal">SEK 0.00</div>
      </div>

      <!-- STRIPE -->
      <div class="method">
        <h2>💳 Pay with Card</h2>

        <button
          class="stripe-btn"
          id="stripeBtn"
          type="button">
          Pay with Card
        </button>

        <div class="message">
          Secure checkout powered by Stripe.
        </div>
      </div>

      <div class="divider">OR</div>

      <!-- PAYPAL -->
      <div class="method">
        <h2>🅿️ Pay with PayPal</h2>

        <div id="paypal-button-container"></div>

        <div id="paypalMessage" class="message"></div>
        <div id="paypalError" class="error"></div>
      </div>

      <a href="cart.html" class="back">
        ← Back to Cart
      </a>

    </div>
  </div>


  <script>
    const STRIPE_API =
      "https://ebshop.vercel.app/api/create-checkout-session";

    const PAYPAL_CREATE_API =
      "https://ebshop.vercel.app/api/paypal-create-order";

    const PAYPAL_CAPTURE_API =
      "https://ebshop.vercel.app/api/paypal-capture-order";


    /* =========================
       CART
    ========================= */

    const cart = JSON.parse(
      localStorage.getItem("ebShopCart") || "[]"
    );

    if (!Array.isArray(cart) || cart.length === 0) {
      alert("Your cart is empty.");
      window.location.href = "cart.html";
    }


    /* =========================
       TOTAL
    ========================= */

    function getTotal() {
      return cart.reduce((sum, item) => {
        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 0;

        return sum + (price * quantity);
      }, 0);
    }

    const total = getTotal();

    document.getElementById("orderTotal").textContent =
      `SEK ${total.toFixed(2)}`;


    /* =========================
       STRIPE
    ========================= */

    document.getElementById("stripeBtn").addEventListener(
      "click",
      async () => {

        const button =
          document.getElementById("stripeBtn");

        button.disabled = true;
        button.textContent = "Opening Stripe...";

        try {

          const response = await fetch(
            STRIPE_API,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                items: cart
              })
            }
          );

          const data = await response.json();

          if (!response.ok || !data.url) {
            throw new Error(
              data.error || "Could not start Stripe payment."
            );
          }

          window.location.href = data.url;

        } catch (error) {

          console.error(error);

          alert(
            error.message ||
            "Stripe payment could not be started."
          );

          button.disabled = false;
          button.textContent = "Pay with Card";
        }
      }
    );


    /* =========================
       PAYPAL
    ========================= */

    if (
      window.paypal &&
      typeof window.paypal.Buttons === "function"
    ) {

      window.paypal.Buttons({

        style: {
          layout: "vertical",
          color: "gold",
          shape: "rect",
          label: "paypal",
          height: 48
        },


        /* CREATE ORDER */

        createOrder: async function () {

          document.getElementById(
            "paypalMessage"
          ).textContent = "Creating PayPal order...";

          document.getElementById(
            "paypalError"
          ).textContent = "";

          try {

            const response = await fetch(
              PAYPAL_CREATE_API,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  items: cart
                })
              }
            );

            const data = await response.json();

            if (!response.ok || !data.id) {
              throw new Error(
                data.error ||
                "Could not create PayPal order."
              );
            }

            return data.id;

          } catch (error) {

            console.error(error);

            document.getElementById(
              "paypalMessage"
            ).textContent = "";

            document.getElementById(
              "paypalError"
            ).textContent =
              error.message ||
              "PayPal order could not be created.";

            throw error;
          }
        },


        /* PAYMENT APPROVED */

        onApprove: async function (data) {

          document.getElementById(
            "paypalMessage"
          ).textContent =
            "Completing your payment...";

          try {

            const response = await fetch(
              PAYPAL_CAPTURE_API,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  orderID: data.orderID
                })
              }
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(
                result.error ||
                "Could not complete PayPal payment."
              );
            }

            if (
              result.status === "COMPLETED"
            ) {

              localStorage.setItem(
                "ebShopLastOrder",
                JSON.stringify({
                  paymentMethod: "PayPal",
                  paymentStatus: "Paid",
                  orderStatus: "Order Received",
                  total: total,
                  currency: "SEK",
                  items: cart,
                  paypalOrderId: data.orderID,
                  createdAt: new Date().toISOString()
                })
              );

              localStorage.removeItem("ebShopCart");

              window.location.href =
                "orders.html?payment=paypal-success";

            } else {

              throw new Error(
                "PayPal payment was not completed."
              );
            }

          } catch (error) {

            console.error(error);

            document.getElementById(
              "paypalMessage"
            ).textContent = "";

            document.getElementById(
              "paypalError"
            ).textContent =
              error.message ||
              "PayPal payment could not be completed.";
          }
        },


        /* CANCEL */

        onCancel: function () {

          document.getElementById(
            "paypalMessage"
          ).textContent =
            "PayPal payment was cancelled.";

        },


        /* ERROR */

        onError: function (error) {

          console.error(
            "PayPal Button Error:",
            error
          );

          document.getElementById(
            "paypalMessage"
          ).textContent = "";

          document.getElementById(
            "paypalError"
          ).textContent =
            "PayPal payment could not be started.";
        }

      }).render(
        "#paypal-button-container"
      );

    } else {

      document.getElementById(
        "paypalError"
      ).textContent =
        "PayPal could not load. Check your Client ID.";
    }

  </script>

</body>
</html>
