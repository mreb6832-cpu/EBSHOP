<script type="module">
  import { supabase } from "./supabaseClient.js";

  const CART_KEY = "ebShopCart";

  let cart = [];


  /* =========================
     ELEMENTS
  ========================== */

  const payButton =
    document.getElementById("payButton");

  const message =
    document.getElementById("message");

  const productName =
    document.getElementById("productName");

  const productDescription =
    document.getElementById("productDescription");

  const productPriceTop =
    document.getElementById("productPriceTop");

  const productQuantity =
    document.getElementById("productQuantity");

  const productImage =
    document.getElementById("productImage");

  const subtotal =
    document.getElementById("subtotal");

  const totalElement =
    document.getElementById("total");

  const customerEmail =
    document.getElementById("customerEmail");

  const customerPhone =
    document.getElementById("customerPhone");

  const cardOption =
    document.getElementById("cardOption");

  const klarnaOption =
    document.getElementById("klarnaOption");


  /* =========================
     LOAD CART
  ========================== */

  function loadCart() {
    try {
      cart = JSON.parse(
        localStorage.getItem(CART_KEY) || "[]"
      );

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch (error) {
      console.error(
        "Could not load cart:",
        error
      );

      cart = [];
    }
  }


  /* =========================
     SAVE CART
  ========================== */

  function saveCart() {
    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );
  }


  /* =========================
     ESCAPE HTML
  ========================== */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     LOAD PRODUCTS
     FROM SUPABASE
  ========================== */

  async function syncCartWithSupabase() {

    if (!cart.length) {
      showEmptyCart();
      return;
    }


    const productIds = cart
      .map(item => item.id)
      .filter(Boolean);


    if (!productIds.length) {
      message.textContent =
        "Your cart contains an old product item. Please return to the products page and add the product again.";

      showOrderSummary();

      return;
    }


    try {

      const { data, error } =
        await supabase
          .from("products")
          .select(
            "id, name, price, stock, category, image, description"
          )
          .in("id", productIds);


      if (error) {
        console.error(
          "Supabase product error:",
          error
        );

        message.textContent =
          "Could not load your products.";

        showOrderSummary();

        return;
      }


      const products =
        Array.isArray(data)
          ? data
          : [];


      const syncedCart = [];


      for (const item of cart) {

        const product =
          products.find(
            p =>
              String(p.id) ===
              String(item.id)
          );


        if (!product) {
          continue;
        }


        const stock =
          Number(product.stock) || 0;

        const requestedQuantity =
          Number(item.quantity) || 1;


        if (stock <= 0) {
          continue;
        }


        const quantity =
          Math.min(
            requestedQuantity,
            stock
          );


        syncedCart.push({
          id: product.id,
          name: product.name || "E&B SHOP Product",
          price: Number(product.price) || 0,
          quantity,
          stock,
          category: product.category || "",
          image: product.image || "",
          description:
            product.description ||
            "High quality product"
        });

      }


      cart = syncedCart;

      saveCart();

      showOrderSummary();


    } catch (error) {

      console.error(
        "Unexpected Supabase error:",
        error
      );

      message.textContent =
        "Could not load your products.";

      showOrderSummary();
    }
  }


  /* =========================
     EMPTY CART
  ========================== */

  function showEmptyCart() {

    productName.textContent =
      "Your cart is empty";

    productDescription.textContent =
      "Add products before checkout";

    productQuantity.textContent =
      "× 0";

    productPriceTop.textContent =
      "SEK 0.00";

    subtotal.textContent =
      "SEK 0.00";

    totalElement.textContent =
      "SEK 0.00";

    productImage.innerHTML = `
      <div class="product-placeholder">
        🛍️
      </div>
    `;
  }


  /* =========================
     ORDER SUMMARY
  ========================== */

  function showOrderSummary() {

    if (!cart.length) {
      showEmptyCart();
      return;
    }


    /*
      Show the first product
      in the left checkout panel.
    */

    const firstItem =
      cart[0];


    productName.textContent =
      firstItem.name ||
      "E&B SHOP Product";


    productDescription.textContent =
      firstItem.description ||
      "High quality product";


    productQuantity.textContent =
      `× ${firstItem.quantity}`;


    if (firstItem.image) {

      productImage.innerHTML = `
        <img
          src="${escapeHtml(firstItem.image)}"
          alt="${escapeHtml(
            firstItem.name || "Product"
          )}"
        >
      `;

    } else {

      productImage.innerHTML = `
        <div class="product-placeholder">
          🛍️
        </div>
      `;
    }


    let total = 0;


    cart.forEach(item => {

      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 1;

      total +=
        price * quantity;

    });


    const formattedTotal =
      `SEK ${total.toFixed(2)}`;


    /*
      The product price shown
      on the left represents
      the whole cart total.
    */

    productPriceTop.textContent =
      formattedTotal;

    subtotal.textContent =
      formattedTotal;

    totalElement.textContent =
      formattedTotal;
  }


  /* =========================
     SAVED CUSTOMER INFO
  ========================== */

  const savedEmail =
    localStorage.getItem(
      "ebShopCustomerEmail"
    );

  const savedPhone =
    localStorage.getItem(
      "ebShopCustomerPhone"
    );


  if (savedEmail) {
    customerEmail.value =
      savedEmail;
  }


  if (savedPhone) {
    customerPhone.value =
      savedPhone;
  }


  /* =========================
     PAYMENT METHOD
  ========================== */

  cardOption.addEventListener(
    "click",
    () => {

      cardOption.classList.add(
        "active"
      );

      klarnaOption.classList.remove(
        "active"
      );
    }
  );


  klarnaOption.addEventListener(
    "click",
    () => {

      klarnaOption.classList.add(
        "active"
      );

      cardOption.classList.remove(
        "active"
      );
    }
  );


  /* =========================
     SAVE CUSTOMER INFO
  ========================== */

  customerEmail.addEventListener(
    "change",
    () => {

      localStorage.setItem(
        "ebShopCustomerEmail",
        customerEmail.value.trim()
      );
    }
  );


  customerPhone.addEventListener(
    "change",
    () => {

      localStorage.setItem(
        "ebShopCustomerPhone",
        customerPhone.value.trim()
      );
    }
  );


  /* =========================
     STRIPE CHECKOUT
  ========================== */

  payButton.addEventListener(
    "click",
    async () => {

      if (!cart.length) {

        message.textContent =
          "Your cart is empty.";

        return;
      }


      const email =
        customerEmail.value.trim();


      if (!email) {

        message.textContent =
          "Please enter your email.";

        customerEmail.focus();

        return;
      }


      payButton.disabled = true;

      payButton.textContent =
        "Processing...";

      message.textContent = "";


      try {

        /*
          Send only the current
          Supabase product data
          to the Stripe backend.
        */

        const items =
          cart.map(item => ({
            id: item.id,
            name: item.name,
            price: item.price,
            quantity: item.quantity,
            image: item.image || ""
          }));


        const response =
          await fetch(
            "/api/create-checkout-session",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                items,
                customerEmail: email,
                customerPhone:
                  customerPhone.value.trim()
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.url) {

          throw new Error(
            data.error ||
            "Could not start Stripe Checkout."
          );
        }


        /*
          Go to Stripe's
          secure checkout.
        */

        window.location.href =
          data.url;


      } catch (error) {

        console.error(
          "Payment error:",
          error
        );


        message.textContent =
          error.message ||
          "Payment could not be started.";


        payButton.disabled =
          false;

        payButton.textContent =
          "Pay";
      }
    }
  );


  /* =========================
     START
  ========================== */

  loadCart();

  syncCartWithSupabase();

</script>
