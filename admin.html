<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E&B SHOP - Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    #logoutBtn {
      border: none;
      background: #fff;
      color: #111;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .stat span {
      display: block;
      color: #666;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-btn {
      background: #111;
      color: white;
    }

    .cancel-btn {
      background: #ddd;
      color: #111;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .empty {
      color: #777;
      padding: 20px 0;
    }

    #loading {
      text-align: center;
      padding: 40px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .stats,
      .form-grid,
      .products {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ E&B SHOP — Admin</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="container">

    <div class="welcome">
      <h2>Admin Dashboard</h2>
      <p>Manage your E&B SHOP products here.</p>
    </div>

    <div id="loading">Checking admin access...</div>

    <div id="adminContent" style="display:none;">

      <section class="stats">
        <div class="stat">
          <span>Total Products</span>
          <strong id="totalProducts">0</strong>
        </div>

        <div class="stat">
          <span>Total Stock</span>
          <strong id="totalStock">0</strong>
        </div>
      </section>

      <section class="card">

        <h2 id="formTitle">Add Product</h2>

        <form id="productForm">

          <div class="form-grid">

            <div class="field">
              <label>Product Name</label>
              <input id="productName" type="text" required>
            </div>

            <div class="field">
              <label>Price (SEK)</label>
              <input id="productPrice" type="number" min="0" step="0.01" required>
            </div>

            <div class="field">
              <label>Category</label>

              <select id="productCategory" required>
                <option value="">Choose category</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Beauty">Beauty</option>
                <option value="Home">Home</option>
                <option value="Sports">Sports</option>
                <option value="Food">Food</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field">
              <label>Stock</label>
              <input id="productStock" type="number" min="0" step="1" required>
            </div>

            <div class="field full">
              <label>Product Picture</label>
              <input id="productImage" type="file" accept="image/*" required>
            </div>

            <div class="field full">
              <label>Description</label>
              <textarea id="productDescription" required></textarea>
            </div>

          </div>

          <div class="buttons">
            <button class="save-btn" type="submit">
              Add Product
            </button>

            <button
              class="cancel-btn"
              id="cancelEdit"
              type="button"
              style="display:none;"
            >
              Cancel
            </button>
          </div>

          <div id="message"></div>

        </form>

      </section>

      <section class="card">

        <h2>Your Products</h2>

        <div id="productsList" class="products">
          <div class="empty">
            Loading products...
          </div>
        </div>

      </section>

    </div>

  </main>

  <script type="module">

    import { supabase } from "./supabaseClient.js";

    const ADMIN_EMAIL = "mucyoemmy539@gmail.com";

    const loading = document.getElementById("loading");
    const adminContent = document.getElementById("adminContent");

    const productForm = document.getElementById("productForm");
    const productName = document.getElementById("productName");
    const productPrice = document.getElementById("productPrice");
    const productCategory = document.getElementById("productCategory");
    const productStock = document.getElementById("productStock");
    const productImage = document.getElementById("productImage");
    const productDescription = document.getElementById("productDescription");

    const productsList = document.getElementById("productsList");
    const totalProducts = document.getElementById("totalProducts");
    const totalStock = document.getElementById("totalStock");
    const message = document.getElementById("message");

    const logoutBtn = document.getElementById("logoutBtn");

    let selectedImage = null;

    productImage.addEventListener("change", function () {
      selectedImage = this.files[0] || null;
    });

    async function checkAdmin() {

      try {

        const {
          data: { user },
          error
        } = await supabase.auth.getUser();

        if (error) {
          throw error;
        }

        if (!user) {
          loading.innerHTML =
            "You are not logged in. <a href='login.html'>Login here</a>";
          return;
        }

        if (user.email !== ADMIN_EMAIL) {
          loading.innerHTML =
            "Access denied. This page is only for the E&B SHOP owner.";
          return;
        }

        loading.style.display = "none";
        adminContent.style.display = "block";

        await loadProducts();

      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "Could not check admin access.<br><br>" +
          error.message;

      }

    }

    async function loadProducts() {

      productsList.innerHTML =
        "<div class='empty'>Loading products...</div>";

      const { data, error } = await supabase
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {

        console.error(error);

        productsList.innerHTML =
          "<div class='empty'>" +
          error.message +
          "</div>";

        return;
      }

      const products = data || [];

      totalProducts.textContent = products.length;

      totalStock.textContent =
        products.reduce(
          (total, product) =>
            total + (Number(product.stock) || 0),
          0
        );

      if (products.length === 0) {

        productsList.innerHTML =
          "<div class='empty'>No products yet.</div>";

        return;
      }

      productsList.innerHTML = products.map(product => {

        const image = product.image
          ? `<img src="${product.image}" alt="${product.name}">`
          : `<div style="height:180px;background:#eee;display:flex;align-items:center;justify-content:center;">No image</div>`;

        return `
          <div class="product">

            ${image}

            <div class="product-info">

              <h3>${product.name}</h3>

              <div class="price">
                ${Number(product.price || 0).toLocaleString("sv-SE")} SEK
              </div>

              <div>
                Category: ${product.category || "Other"}
              </div>

              <div>
                Stock: ${Number(product.stock || 0)}
              </div>

            </div>

          </div>
        `;

      }).join("");

    }

    productForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      if (!selectedImage) {
        alert("Please select a product picture.");
        return;
      }

      const name = productName.value.trim();
      const price = Number(productPrice.value);
      const category = productCategory.value;
      const stock = Number(productStock.value);
      const description = productDescription.value.trim();

      if (!name || !category || !description) {
        alert("Please fill in all fields.");
        return;
      }

      try {

        message.textContent = "Uploading product...";

        const extension =
          selectedImage.name.split(".").pop();

        const fileName =
          Date.now() + "-" +
          Math.random().toString(36).substring(2) +
          "." +
          extension;

        const filePath =
          "products/" + fileName;

        const { error: uploadError } =
          await supabase.storage
            .from("product-images")
            .upload(
              filePath,
              selectedImage,
              {
                cacheControl: "3600",
                upsert: false
              }
            );

        if (uploadError) {
          throw uploadError;
        }

        const { data: publicUrlData } =
          supabase.storage
            .from("product-images")
            .getPublicUrl(filePath);

        const imageUrl =
          publicUrlData.publicUrl;

        const { error: insertError } =
          await supabase
            .from("products")
            .insert({
              name: name,
              price: price,
              category: category,
              stock: stock,
              description: description,
              image: imageUrl
            });

        if (insertError) {
          throw insertError;
        }

        message.textContent =
          "✅ Product added successfully.";

        productForm.reset();
        selectedImage = null;

        await loadProducts();

      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ " + error.message;

      }

    });

    logoutBtn.addEventListener("click", async function () {

      await supabase.auth.signOut();

      window.location.href = "login.html";

    });

    checkAdmin();

  </script>

</body>
</html>
