<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #111;
      border-bottom: 1px solid #2b2b2b;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #d4af37;
    }

    .back-btn {
      text-decoration: none;
      color: #000;
      background: #d4af37;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
    }

    .back-btn:hover {
      background: #f0cf55;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .title p {
      color: #999;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 22px;
    }

    .stat strong {
      display: block;
      color: #d4af37;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .stat span {
      color: #999;
    }

    .panel {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .panel h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #ddd;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #191919;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d4af37;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /*
      IMAGE UPLOAD
    */

    .upload-box {
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      background: #171717;
      transition: .2s;
    }

    .upload-box:hover {
      border-color: #d4af37;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .upload-text {
      color: #bbb;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .file-label {
      display: inline-block;
      background: #d4af37;
      color: #000;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
    }

    .file-label:hover {
      background: #f0cf55;
    }

    #productImage {
      display: none;
    }

    .image-preview {
      margin-top: 20px;
      display: none;
    }

    .image-preview img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #444;
      display: block;
      margin: 0 auto 12px;
    }

    .remove-image {
      border: none;
      background: #2b2b2b;
      color: #fff;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .remove-image:hover {
      background: #444;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .save-btn,
    .cancel-btn {
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }

    .save-btn {
      background: #d4af37;
      color: #000;
    }

    .save-btn:hover {
      background: #f0cf55;
    }

    .cancel-btn {
      background: #2a2a2a;
      color: #fff;
    }

    .cancel-btn:hover {
      background: #3a3a3a;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: 700;
    }

    .products-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product-card {
      background: #171717;
      border: 1px solid #2b2b2b;
      border-radius: 12px;
      overflow: hidden;
    }

    .product-card-image {
      width: 100%;
      height: 220px;
      background: #202020;
      object-fit: cover;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 220px;
      background: #202020;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      color: #666;
    }

    .product-content {
      padding: 17px;
    }

    .product-content h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .category {
      color: #d4af37;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .stock {
      color: #999;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .edit-btn,
    .delete-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .edit-btn {
      background: #d4af37;
      color: #000;
    }

    .delete-btn {
      background: #292929;
      color: #fff;
    }

    .delete-btn:hover {
      background: #3b3b3b;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 40px;
      border: 1px dashed #333;
      border-radius: 10px;
    }

    @media (max-width: 900px) {
      .products-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .navbar {
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .products-list {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 28px;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="navbar">

<a href="index.html" class="logo">
  🛒 <span>E&B</span> SHOP
</a>

<a href="index.html" class="back-btn">
  ← Back to Shop
</a>

  </div>
</header>

<main class="container">

  <div class="title">
    <h1>Owner Dashboard</h1>
    <p>Add and manage products for E&B SHOP.</p>
  </div>

  <section class="stats">

<div class="stat">
  <strong id="totalProducts">0</strong>
  <span>Total Products</span>
</div>

<div class="stat">
  <strong id="totalStock">0</strong>
  <span>Total Stock</span>
</div>

  </section>

  <!-- ADD / EDIT PRODUCT -->

  <section class="panel">

<h2 id="formTitle">
  Add New Product
</h2>

<form id="productForm">

  <div class="form-grid">

    <div class="field">

      <label for="productName">
        Product Name *
      </label>

      <input
        id="productName"
        type="text"
        placeholder="Example: iPhone 15"
        required
      >

    </div>


    <div class="field">

      <label for="productPrice">
        Price (SEK) *
      </label>

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="999"
        required
      >

    </div>


    <div class="field">

      <label for="productCategory">
        Category *
      </label>

      <select
        id="productCategory"
        required
      >

        <option value="">
          Select Category
        </option>

        <option value="Electronics">
          Electronics
        </option>

        <option value="Fashion">
          Fashion
        </option>

        <option value="Shoes">
          Shoes
        </option>

        <option value="Home">
          Home
        </option>

        <option value="Beauty">
          Beauty
        </option>

        <option value="Gaming">
          Gaming
        </option>

        <option value="Kids">
          Kids
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <div class="field">

      <label for="productStock">
        Stock *
      </label>

      <input
        id="productStock"
        type="number"
        min="0"
        step="1"
        placeholder="10"
        required
      >

    </div>


    <!-- REQUIRED PRODUCT PICTURE -->

    <div class="field full">

      <label>
        Product Picture *
      </label>

      <div class="upload-box">

        <div class="upload-icon">
          🖼️
        </div>

        <div class="upload-text">
          Add a clear picture of the product.<br>
          Customers will see this picture before buying.
        </div>

        <label
          for="productImage"
          class="file-label"
        >
          📷 Choose Product Picture
        </label>

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >


        <div
          id="imagePreview"
          class="image-preview"
        >

          <img
            id="previewImage"
            src=""
            alt="Product preview"
          >

          <button
            type="button"
            class="remove-image"
            id="removeImage"
          >
            Remove Picture
          </button>

        </div>

      </div>

    </div>


    <div class="field full">

      <label for="productDescription">
        Product Description *
      </label>

      <textarea
        id="productDescription"
        placeholder="Describe the product..."
        required
      ></textarea>

    </div>

  </div>


  <div class="actions">

    <button
      type="submit"
      class="save-btn"
    >
      💾 Save Product
    </button>

    <button
      type="button"
      class="cancel-btn"
      id="cancelEdit"
      style="display:none;"
    >
      Cancel Edit
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>

</form>

  </section>

  <!-- PRODUCTS -->

  <section class="panel">

<h2>
  Your Products
</h2>

<div
  id="productsList"
  class="products-list"
></div>

  </section>

</main>

<script>

  const STORAGE_KEY =
    "ebShopProducts";


  const productForm =
    document.getElementById(
      "productForm"
    );


  const productName =
    document.getElementById(
      "productName"
    );


  const productPrice =
    document.getElementById(
      "productPrice"
    );


  const productCategory =
    document.getElementById(
      "productCategory"
    );


  const productStock =
    document.getElementById(
      "productStock"
    );


  const productImage =
    document.getElementById(
      "productImage"
    );


  const productDescription =
    document.getElementById(
      "productDescription"
    );


  const imagePreview =
    document.getElementById(
      "imagePreview"
    );


  const previewImage =
    document.getElementById(
      "previewImage"
    );


  const removeImage =
    document.getElementById(
      "removeImage"
    );


  const productsList =
    document.getElementById(
      "productsList"
    );


  const message =
    document.getElementById(
      "message"
    );


  const formTitle =
    document.getElementById(
      "formTitle"
    );


  const cancelEdit =
    document.getElementById(
      "cancelEdit"
    );


  const totalProducts =
    document.getElementById(
      "totalProducts"
    );


  const totalStock =
    document.getElementById(
      "totalStock"
    );


  let products = [];

  let editingId = null;

  let currentImageData = "";


  /*
   * LOAD PRODUCTS
   */

  function loadProducts() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {

      products = [];

      return;

    }


    try {

      const parsed =
        JSON.parse(saved);


      products =
        Array.isArray(parsed)
          ? parsed
          : [];

    } catch {

      products = [];

    }

  }


  /*
   * SAVE PRODUCTS
   */

  function saveProducts() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(products)
    );

  }


  /*
   * IMAGE UPLOAD
   */

  productImage.addEventListener(
    "change",
    function () {

      const file =
        this.files[0];


      if (!file) {
        return;
      }


      if (!file.type.startsWith("image/")) {

        alert(
          "Please choose an image file."
        );

        this.value = "";

        return;
      }


      /*
       * Limit large images.
       */

      if (file.size > 5 * 1024 * 1024) {

        alert(
          "Please choose an image smaller than 5 MB."
        );

        this.value = "";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function (event) {

          currentImageData =
            event.target.result;


          previewImage.src =
            currentImageData;


          imagePreview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


  /*
   * REMOVE IMAGE
   */

  removeImage.addEventListener(
    "click",
    function () {

      currentImageData = "";

      productImage.value = "";

      previewImage.src = "";

      imagePreview.style.display =
        "none";

    }
  );


  /*
   * ADD / EDIT PRODUCT
   */

  productForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      const name =
        productName.value.trim();


      const price =
        Number(productPrice.value);


      const category =
        productCategory.value;


      const stock =
        Number(productStock.value);


      const description =
        productDescription.value.trim();


      /*
       * PRODUCT PICTURE IS REQUIRED
       */

      if (!currentImageData) {

        alert(
          "Please add a picture of the product before saving."
        );

        return;

      }


      if (!name) {

        alert(
          "Please enter the product name."
        );

        return;

      }


      if (
        Number.isNaN(price) ||
        price < 0
      ) {

        alert(
          "Please enter a valid price."
        );

        return;

      }


      if (
        Number.isNaN(stock) ||
        stock < 0
      ) {

        alert(
          "Please enter valid stock."
        );

        return;

      }


      if (!description) {

        alert(
          "Please enter a product description."
        );

        return;

      }


      /*
       * EDIT EXISTING PRODUCT
       */

      if (editingId !== null) {

        const index =
          products.findIndex(
            product =>
              String(product.id) ===
              String(editingId)
          );


        if (index !== -1) {

          products[index] = {

            ...products[index],

            name: name,

            price: price,

            category: category,

            stock: stock,

            image: currentImageData,

            description: description

          };

        }


        showMessage(
          "Product updated successfully."
        );

      }

      /*
       * ADD NEW PRODUCT
       */

      else {

        const newProduct = {

          id:
            Date.now().toString(),

          name: name,

          price: price,

          category: category,

          stock: stock,

          image: currentImageData,

          description: description

        };


        products.unshift(
          newProduct
        );


        showMessage(
          "Product added successfully."
        );

      }


      saveProducts();

      resetForm();

      renderProducts();

    }
  );


  /*
   * RENDER PRODUCTS
   */

  function renderProducts() {

    totalProducts.textContent =
      products.length;


    const stockTotal =
      products.reduce(
        (total, product) =>
          total +
          (Number(product.stock) || 0),
        0
      );


    totalStock.textContent =
      stockTotal;


    if (products.length === 0) {

      productsList.innerHTML = `

        <div class="empty"
             style="grid-column:1/-1;">

          No products yet.
          Add your first product above.

        </div>

      `;

      return;

    }


    productsList.innerHTML =
      products.map(
        product => {

          const image =
            product.image

              ? `

                <img
                  class="product-card-image"
                  src="${escapeHtml(product.image)}"
                  alt="${escapeHtml(product.name)}"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                  class="no-image"
                  style="display:none;"
                >
                  🛍️
                </div>

              `

              : `

                <div class="no-image">
                  🛍️
                </div>

              `;


          return `

            <div class="product-card">

              ${image}


              <div class="product-content">

                <div class="category">
                  ${escapeHtml(
                    product.category || "Other"
                  )}
                </div>


                <h3>
                  ${escapeHtml(
                    product.name
                  )}
                </h3>


                <div class="product-price">
                  ${formatPrice(
                    product.price
                  )}
                </div>


                <div class="stock">
                  Stock:
                  ${Number(product.stock) || 0}
                </div>


                <div class="product-actions">

                  <button
                    class="edit-btn"
                    onclick="editProduct('${escapeJs(product.id)}')"
                  >
                    ✏️ Edit
                  </button>


                  <button
                    class="delete-btn"
                    onclick="deleteProduct('${escapeJs(product.id)}')"
                  >
                    🗑️ Delete
                  </button>

                </div>

              </div>

            </div>

          `;

        }
      ).join("");

  }


  /*
   * EDIT PRODUCT
   */

  window.editProduct =
    function (id) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(id)
        );


      if (!product) {
        return;
      }


      editingId =
        product.id;


      productName.value =
        product.name || "";


      productPrice.value =
        product.price || "";


      productCategory.value =
        product.category || "";


      productStock.value =
        product.stock || 0;


      productDescription.value =
        product.description || "";


      currentImageData =
        product.image || "";


      if (currentImageData) {

        previewImage.src =
          currentImageData;

        imagePreview.style.display =
          "block";

      } else {

        imagePreview.style.display =
          "none";

      }


      formTitle.textContent =
        "Edit Product";


      cancelEdit.style.display =
        "inline-block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  /*
   * DELETE PRODUCT
   */

  window.deleteProduct =
    function (id) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(id)
        );


      if (!product) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${product.name}"?`
        );


      if (!confirmed) {
        return;
      }


      products =
        products.filter(
          item =>
            String(item.id) !==
            String(id)
        );


      saveProducts();

      renderProducts();


      showMessage(
        "Product deleted successfully."
      );

    };


  /*
   * CANCEL EDIT
   */

  cancelEdit.addEventListener(
    "click",
    function () {

      resetForm();

    }
  );


  /*
   * RESET FORM
   */

  function resetForm() {

    productForm.reset();

    editingId = null;

    currentImageData = "";

    previewImage.src = "";

    imagePreview.style.display =
      "none";

    formTitle.textContent =
      "Add New Product";

    cancelEdit.style.display =
      "none";

  }


  /*
   * MESSAGE
   */

  function showMessage(text) {

    message.textContent =
      text;

    message.style.display =
      "block";

    message.style.background =
      "#1c351c";

    message.style.color =
      "#a9e5a9";


    setTimeout(
      function () {

        message.style.display =
          "none";

      },
      3000
    );

  }


  /*
   * PRICE FORMAT
   */

  function formatPrice(price) {

    return (
      Number(price || 0)
        .toLocaleString(
          "sv-SE",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      + " SEK"
    );

  }


  /*
   * HTML SECURITY
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeJs(value) {

    return String(value ?? "")
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }


  /*
   * START
   */

  loadProducts();

  renderProducts();

</script>

</body>
</html>
