<script type="module">
  import { supabase } from "./supabaseClient.js";

  const productForm = document.getElementById("productForm");
  const productName = document.getElementById("productName");
  const productPrice = document.getElementById("productPrice");
  const productCategory = document.getElementById("productCategory");
  const productStock = document.getElementById("productStock");
  const productImage = document.getElementById("productImage");
  const productDescription = document.getElementById("productDescription");

  const imagePreview = document.getElementById("imagePreview");
  const previewImage = document.getElementById("previewImage");
  const removeImage = document.getElementById("removeImage");

  const productsList = document.getElementById("productsList");
  const message = document.getElementById("message");
  const formTitle = document.getElementById("formTitle");
  const cancelEdit = document.getElementById("cancelEdit");

  const totalProducts = document.getElementById("totalProducts");
  const totalStock = document.getElementById("totalStock");

  let products = [];
  let editingId = null;
  let selectedImageFile = null;
  let currentImageUrl = "";

  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {
    productsList.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        Loading products...
      </div>
    `;

    const { data, error } = await supabase
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);

      productsList.innerHTML = `
        <div class="empty" style="grid-column:1/-1;">
          Could not load products.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }

    products = data || [];

    renderProducts();
  }


  /* =========================
     IMAGE SELECT
  ========================= */

  productImage.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {
      alert("Please choose an image file.");
      this.value = "";
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("Please choose an image smaller than 5 MB.");
      this.value = "";
      return;
    }

    selectedImageFile = file;

    const previewUrl = URL.createObjectURL(file);

    previewImage.src = previewUrl;
    imagePreview.style.display = "block";
  });


  /* =========================
     REMOVE IMAGE
  ========================= */

  removeImage.addEventListener("click", function () {
    selectedImageFile = null;
    productImage.value = "";

    if (currentImageUrl) {
      previewImage.src = currentImageUrl;
      imagePreview.style.display = "block";
    } else {
      previewImage.src = "";
      imagePreview.style.display = "none";
    }
  });


  /* =========================
     UPLOAD IMAGE
  ========================= */

  async function uploadImage(file) {
    if (!file) {
      return currentImageUrl || "";
    }

    const extension =
      file.name.split(".").pop().toLowerCase();

    const fileName =
      `${crypto.randomUUID()}.${extension}`;

    const filePath =
      `products/${fileName}`;

    const { error: uploadError } =
      await supabase.storage
        .from("product-images")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false
        });

    if (uploadError) {
      throw uploadError;
    }

    const { data } =
      supabase.storage
        .from("product-images")
        .getPublicUrl(filePath);

    return data.publicUrl;
  }


  /* =========================
     ADD / EDIT PRODUCT
  ========================= */

  productForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const name =
      productName.value.trim();

    const price =
      Number(productPrice.value);

    const category =
      productCategory.value;

    const stock =
      Number(productStock.value);

    const description =
      productDescription.value.trim();


    if (!name) {
      alert("Please enter the product name.");
      return;
    }

    if (!Number.isFinite(price) || price < 0) {
      alert("Please enter a valid price.");
      return;
    }

    if (!category) {
      alert("Please select a category.");
      return;
    }

    if (!Number.isInteger(stock) || stock < 0) {
      alert("Please enter valid stock.");
      return;
    }

    if (!description) {
      alert("Please enter a product description.");
      return;
    }


    /*
      Picture is required when creating
      a new product.

      During edit, the old picture
      can remain.
    */

    if (!editingId && !selectedImageFile) {
      alert("Please add a picture of the product.");
      return;
    }


    const saveButton =
      productForm.querySelector(".save-btn");

    const oldButtonText =
      saveButton.innerHTML;

    saveButton.disabled = true;
    saveButton.innerHTML = "Saving...";


    try {

      /* =========================
         UPLOAD IMAGE
      ========================= */

      let imageUrl = currentImageUrl;

      if (selectedImageFile) {
        imageUrl =
          await uploadImage(selectedImageFile);
      }


      /* =========================
         EDIT
      ========================= */

      if (editingId) {

        const { error } =
          await supabase
            .from("products")
            .update({
              name: name,
              price: price,
              category: category,
              stock: stock,
              description: description,
              image: imageUrl
            })
            .eq("id", editingId);

        if (error) {
          throw error;
        }

        showMessage(
          "Product updated successfully."
        );

      }

      /* =========================
         ADD
      ========================= */

      else {

        const { error } =
          await supabase
            .from("products")
            .insert({
              name: name,
              price: price,
              category: category,
              stock: stock,
              description: description,
              image: imageUrl
            });

        if (error) {
          throw error;
        }

        showMessage(
          "Product added successfully."
        );
      }


      /* =========================
         RESET
      ========================= */

      resetForm();

      await loadProducts();

    } catch (error) {

      console.error(error);

      alert(
        "Could not save product:\n\n" +
        error.message
      );

    } finally {

      saveButton.disabled = false;
      saveButton.innerHTML = oldButtonText;

    }
  });


  /* =========================
     RENDER PRODUCTS
  ========================= */

  function renderProducts() {

    totalProducts.textContent =
      products.length;


    const stockTotal =
      products.reduce(
        (total, product) =>
          total +
          (Number(product.stock) || 0),
        0
      );

    totalStock.textContent =
      stockTotal;


    if (products.length === 0) {

      productsList.innerHTML = `
        <div
          class="empty"
          style="grid-column:1/-1;"
        >
          No products yet.
          Add your first product above.
        </div>
      `;

      return;
    }


    productsList.innerHTML =
      products.map(product => {

        const image =
          product.image
            ? `
              <img
                class="product-card-image"
                src="${escapeHtml(product.image)}"
                alt="${escapeHtml(product.name)}"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="no-image"
                style="display:none;"
              >
                🛍️
              </div>
            `
            : `
              <div class="no-image">
                🛍️
              </div>
            `;


        return `
          <div class="product-card">

            ${image}

            <div class="product-content">

              <div class="category">
                ${escapeHtml(
                  product.category || "Other"
                )}
              </div>

              <h3>
                ${escapeHtml(
                  product.name
                )}
              </h3>

              <div class="product-price">
                ${formatPrice(product.price)}
              </div>

              <div class="stock">
                Stock:
                ${Number(product.stock) || 0}
              </div>

              <div class="product-actions">

                <button
                  class="edit-btn"
                  onclick="editProduct('${escapeJs(product.id)}')"
                >
                  ✏️ Edit
                </button>

                <button
                  class="delete-btn"
                  onclick="deleteProduct('${escapeJs(product.id)}')"
                >
                  🗑️ Delete
                </button>

              </div>

            </div>

          </div>
        `;

      }).join("");
  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  window.editProduct =
    function (id) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(id)
        );

      if (!product) {
        return;
      }

      editingId =
        product.id;

      productName.value =
        product.name || "";

      productPrice.value =
        product.price ?? "";

      productCategory.value =
        product.category || "";

      productStock.value =
        product.stock ?? 0;

      productDescription.value =
        product.description || "";

      currentImageUrl =
        product.image || "";

      selectedImageFile = null;
      productImage.value = "";


      if (currentImageUrl) {
        previewImage.src =
          currentImageUrl;

        imagePreview.style.display =
          "block";
      } else {
        imagePreview.style.display =
          "none";
      }


      formTitle.textContent =
        "Edit Product";

      cancelEdit.style.display =
        "inline-block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };


  /* =========================
     DELETE PRODUCT
  ========================= */

  window.deleteProduct =
    async function (id) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(id)
        );

      if (!product) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${product.name}"?`
        );

      if (!confirmed) {
        return;
      }


      try {

        const { error } =
          await supabase
            .from("products")
            .delete()
            .eq("id", id);

        if (error) {
          throw error;
        }


        showMessage(
          "Product deleted successfully."
        );

        await loadProducts();

      } catch (error) {

        console.error(error);

        alert(
          "Could not delete product:\n\n" +
          error.message
        );
      }
    };


  /* =========================
     CANCEL EDIT
  ========================= */

  cancelEdit.addEventListener(
    "click",
    function () {
      resetForm();
    }
  );


  /* =========================
     RESET FORM
  ========================= */

  function resetForm() {

    productForm.reset();

    editingId = null;

    selectedImageFile = null;

    currentImageUrl = "";

    previewImage.src = "";

    imagePreview.style.display =
      "none";

    formTitle.textContent =
      "Add New Product";

    cancelEdit.style.display =
      "none";
  }


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(text) {

    message.textContent =
      text;

    message.style.display =
      "block";

    message.style.background =
      "#1c351c";

    message.style.color =
      "#a9e5a9";


    setTimeout(() => {
      message.style.display =
        "none";
    }, 3000);
  }


  /* =========================
     PRICE FORMAT
  ========================= */

  function formatPrice(price) {

    return (
      Number(price || 0)
        .toLocaleString(
          "sv-SE",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      + " SEK"
    );
  }


  /* =========================
     HTML SECURITY
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeJs(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  /* =========================
     START
  ========================= */

  loadProducts();

</script>
