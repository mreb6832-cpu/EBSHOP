<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #000;
      border-bottom: 1px solid #c9a227;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d4af37;
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #d4af37;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 40px auto;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 30px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .box {
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 25px;
    }

    .box h2 {
      color: #d4af37;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #ddd;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #d4af37;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #333;
    }

    .item-name {
      font-weight: bold;
    }

    .item-info {
      color: #aaa;
      font-size: 14px;
      margin-top: 5px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
    }

    .total {
      border-top: 1px solid #555;
      margin-top: 12px;
      padding-top: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #d4af37;
    }

    .payment-note {
      background: #191500;
      border: 1px solid #806b18;
      padding: 14px;
      border-radius: 8px;
      margin-top: 20px;
      color: #ddd;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #d4af37;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #f0cf55;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #d4af37;
      text-decoration: none;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #2a1010;
      border: 1px solid #8b3030;
      border-radius: 8px;
      color: #ffb0b0;
    }

    .success-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #102a16;
      border: 1px solid #347a45;
      border-radius: 8px;
      color: #b8f0c3;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 12px;
      }

      nav a {
        margin: 0 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛒 E&B SHOP</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="account.html">Account</a>
  </nav>
</header>

<div class="container">

  <h1>Secure Checkout</h1>

  <div class="grid">

    <!-- CUSTOMER INFORMATION -->
    <div class="box">

      <h2>Customer Information</h2>

      <form id="paymentForm">

        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          required
          placeholder="Your full name"
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          required
          placeholder="you@example.com"
        >

        <label for="phone">Phone</label>
        <input
          type="tel"
          id="phone"
          required
          placeholder="+46..."
        >

        <h2 style="margin-top:25px;">Delivery Address</h2>

        <label for="street">Street Address</label>
        <input
          type="text"
          id="street"
          required
          placeholder="Street and house number"
        >

        <label for="city">City</label>
        <input
          type="text"
          id="city"
          required
          placeholder="City"
        >

        <label for="postcode">Postcode</label>
        <input
          type="text"
          id="postcode"
          required
          placeholder="Postcode"
        >

        <label for="notes">Order Notes</label>
        <textarea
          id="notes"
          placeholder="Optional notes..."
        ></textarea>

        <div class="payment-note">
          <strong>Payment:</strong><br>
          You will be redirected to Stripe's secure checkout
          page to complete your payment.
        </div>

        <div id="errorMessage" class="error"></div>

        <div id="successMessage" class="success-message">
          Redirecting to Stripe...
        </div>

        <button id="payButton" type="submit">
          Pay Now
        </button>

      </form>

    </div>


    <!-- ORDER SUMMARY -->
    <div class="box">

      <h2>Order Summary</h2>

      <div id="orderItems"></div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">0 SEK</span>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span>FREE</span>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <span id="total">0 SEK</span>
      </div>

      <a class="back" href="cart.html">
        ← Back to Cart
      </a>

    </div>

  </div>

</div>


<script>
  /*
    E&B SHOP
    Stripe Test Checkout
  */

  const STRIPE_API =
    "https://ebshop.vercel.app/api/create-checkout-session";


  const cart =
    JSON.parse(localStorage.getItem("ebShopCart")) || [];


  const customerName =
    localStorage.getItem("ebShopCustomerName") || "";

  const customerEmail =
    localStorage.getItem("ebShopCustomerEmail") || "";


  const fullNameInput =
    document.getElementById("fullName");

  const emailInput =
    document.getElementById("email");


  fullNameInput.value = customerName;
  emailInput.value = customerEmail;


  const orderItems =
    document.getElementById("orderItems");

  const subtotalElement =
    document.getElementById("subtotal");

  const totalElement =
    document.getElementById("total");

  const form =
    document.getElementById("paymentForm");

  const payButton =
    document.getElementById("payButton");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");


  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
  }


  function calculateSubtotal() {
    return cart.reduce((sum, item) => {
      return sum +
        Number(item.price || 0) *
        Number(item.quantity || 1);
    }, 0);
  }


  function renderOrder() {

    if (!cart.length) {

      orderItems.innerHTML = `
        <div class="empty">
          Your cart is empty.
        </div>
      `;

      subtotalElement.textContent = "0 SEK";
      totalElement.textContent = "0 SEK";

      payButton.disabled = true;

      return;
    }


    orderItems.innerHTML = cart.map(item => {

      const price =
        Number(item.price || 0);

      const quantity =
        Number(item.quantity || 1);

      const lineTotal =
        price * quantity;

      return `
        <div class="item">

          <div>
            <div class="item-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="item-info">
              ${quantity} × ${price.toFixed(2)} SEK
            </div>
          </div>

          <strong>
            ${lineTotal.toFixed(2)} SEK
          </strong>

        </div>
      `;

    }).join("");


    const subtotal =
      calculateSubtotal();

    subtotalElement.textContent =
      subtotal.toFixed(2) + " SEK";

    totalElement.textContent =
      subtotal.toFixed(2) + " SEK";
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorMessage.style.display = "none";

    if (!cart.length) {
      showError("Your cart is empty.");
      return;
    }


    const customer = {

      fullName:
        fullNameInput.value.trim(),

      email:
        emailInput.value.trim(),

      phone:
        document
          .getElementById("phone")
          .value.trim()
    };


    const delivery = {

      street:
        document
          .getElementById("street")
          .value.trim(),

      city:
        document
          .getElementById("city")
          .value.trim(),

      postcode:
        document
          .getElementById("postcode")
          .value.trim(),

      country:
        "Sweden"
    };


    const notes =
      document
        .getElementById("notes")
        .value.trim();


    if (
      !customer.fullName ||
      !customer.email ||
      !customer.phone ||
      !delivery.street ||
      !delivery.city ||
      !delivery.postcode
    ) {

      showError(
        "Please complete all required information."
      );

      return;
    }


    payButton.disabled = true;

    payButton.textContent =
      "Connecting to Stripe...";


    try {

      const response =
        await fetch(STRIPE_API, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            items: cart
          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not start payment."
        );

      }


      if (!data.url) {

        throw new Error(
          "Stripe Checkout URL was not returned."
        );

      }


      /*
        Save customer/order information locally
        before redirecting to Stripe.
      */

      const order = {

        orderNumber:
          "EB-" +
          Date.now(),

        customer,

        delivery,

        notes,

        items: cart,

        subtotal:
          calculateSubtotal(),

        deliveryFee:
          0,

        total:
          calculateSubtotal(),

        paymentMethod:
          "Stripe",

        paymentStatus:
          "Payment Pending",

        orderStatus:
          "Order Received",

        createdAt:
          new Date().toISOString()

      };


      localStorage.setItem(
        "ebShopLastOrder",
        JSON.stringify(order)
      );


      localStorage.setItem(
        "ebShopCustomerName",
        customer.fullName
      );


      localStorage.setItem(
        "ebShopCustomerEmail",
        customer.email
      );


      localStorage.setItem(
        "ebShopLoggedIn",
        "true"
      );


      successMessage.style.display =
        "block";

      payButton.textContent =
        "Redirecting...";


      /*
        Go to Stripe Checkout
      */

      window.location.href =
        data.url;


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Something went wrong while starting payment."
      );

      payButton.disabled = false;

      payButton.textContent =
        "Pay Now";
    }

  });


  renderOrder();

</script>

</body>
</html>
