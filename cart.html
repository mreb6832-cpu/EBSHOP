<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E&B SHOP - Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #292929;
      background: #050505;
    }

    .logo {
      color: #e3b82f;
      font-size: 30px;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    nav a:hover {
      color: #e3b82f;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 45px;
    }

    .hero h1 {
      color: #e3b82f;
      font-size: 50px;
      margin: 0 0 14px;
    }

    .hero p {
      color: #aeb6c2;
      font-size: 21px;
      margin: 0;
    }

    .cart-layout {
      width: 88%;
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      padding-bottom: 60px;
    }

    .cart-box,
    .summary-box {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 32px;
    }

    .box-title {
      color: #e3b82f;
      font-size: 32px;
      margin: 0 0 45px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 24px;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid #292929;
    }

    .product-image {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
    }

    .product-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-price {
      color: #e3b82f;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 17px;
    }

    .quantity-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #171717;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .quantity-btn:hover {
      border-color: #e3b82f;
      color: #e3b82f;
    }

    .quantity {
      font-size: 18px;
      min-width: 15px;
      text-align: center;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 16px;
      margin-left: 5px;
    }

    .remove-btn:hover {
      color: #ff5b5b;
    }

    .item-total {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 21px 0;
      border-bottom: 1px solid #292929;
      color: #bfc6d0;
      font-size: 19px;
    }

    .summary-row strong {
      color: white;
    }

    .free {
      color: #e3b82f !important;
      font-weight: 700;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 28px;
      font-weight: 800;
    }

    .total-price {
      color: #e3b82f;
    }

    .checkout-btn {
      width: 100%;
      height: 64px;
      margin-top: 40px;
      border: none;
      border-radius: 10px;
      background: #e3b82f;
      color: #080808;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #f0c83f;
    }

    .continue-shopping {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #e3b82f;
      text-decoration: none;
      font-size: 18px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 70px 20px;
      font-size: 20px;
    }

    @media (max-width: 900px) {

      .cart-layout {
        grid-template-columns: 1fr;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 15px;
      }
    }

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      .logo {
        font-size: 23px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .cart-box,
      .summary-box {
        padding: 22px;
      }

      .cart-item {
        grid-template-columns: 80px 1fr;
      }

      .product-image {
        width: 80px;
        height: 80px;
      }

      .item-total {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">
      E&B SHOP
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="account.html">My Account</a>
      <a href="orders.html">Orders</a>
    </nav>

  </header>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Your Cart
    </h1>

    <p>
      Review your products before continuing.
    </p>

  </section>


  <!-- CART -->

  <main class="cart-layout">

    <section class="cart-box">

      <h2 class="box-title">
        Shopping Cart
      </h2>

      <div id="cartItems"></div>

    </section>


    <!-- SUMMARY -->

    <aside class="summary-box">

      <h2 class="box-title">
        Order Summary
      </h2>

      <div class="summary-row">

        <span>
          Items
        </span>

        <strong id="itemCount">
          0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <strong id="subtotal">
          0 SEK
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Delivery
        </span>

        <strong class="free">
          FREE
        </strong>

      </div>


      <div class="total-row">

        <span>
          Total
        </span>

        <span
          id="total"
          class="total-price"
        >
          0 SEK
        </span>

      </div>


      <!-- PROCEED TO CHECKOUT -->

      <button
        id="checkoutButton"
        class="checkout-btn"
        type="button"
      >
        Proceed to Checkout
      </button>


      <a
        href="products.html"
        class="continue-shopping"
      >
        ← Continue Shopping
      </a>

    </aside>

  </main>


  <script>

    /* =========================
       CART DATA
    ========================== */

    let cart = JSON.parse(
      localStorage.getItem("ebShopCart") || "[]"
    );


    /* =========================
       ELEMENTS
    ========================== */

    const cartItems =
      document.getElementById("cartItems");

    const itemCount =
      document.getElementById("itemCount");

    const subtotal =
      document.getElementById("subtotal");

    const total =
      document.getElementById("total");

    const checkoutButton =
      document.getElementById("checkoutButton");


    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       SAVE CART
    ========================== */

    function saveCart() {

      localStorage.setItem(
        "ebShopCart",
        JSON.stringify(cart)
      );

    }


    /* =========================
       RENDER CART
    ========================== */

    function renderCart() {

      cartItems.innerHTML = "";

      let totalAmount = 0;
      let totalItems = 0;


      if (!cart.length) {

        cartItems.innerHTML = `
          <div class="empty">
            Your cart is empty.
          </div>
        `;

        itemCount.textContent = "0";
        subtotal.textContent = "0 SEK";
        total.textContent = "0 SEK";

        return;
      }


      cart.forEach((item, index) => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 1;

        const itemTotal =
          price * quantity;

        totalAmount += itemTotal;
        totalItems += quantity;


        const image =
          item.image ||
          "https://via.placeholder.com/300x300?text=Product";


        const name =
          item.name ||
          "E&B SHOP Product";


        cartItems.innerHTML += `

          <div class="cart-item">

            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
            >

            <div>

              <div class="product-name">
                ${escapeHtml(name)}
              </div>

              <div class="product-price">
                ${price} SEK
              </div>

              <div class="quantity-area">

                <button
                  class="quantity-btn"
                  onclick="changeQuantity(${index}, -1)"
                  type="button"
                >
                  −
                </button>

                <span class="quantity">
                  ${quantity}
                </span>

                <button
                  class="quantity-btn"
                  onclick="changeQuantity(${index}, 1)"
                  type="button"
                >
                  +
                </button>

                <button
                  class="remove-btn"
                  onclick="removeItem(${index})"
                  type="button"
                >
                  Remove
                </button>

              </div>

            </div>

            <div class="item-total">
              ${itemTotal} SEK
            </div>

          </div>

        `;

      });


      itemCount.textContent =
        totalItems;

      subtotal.textContent =
        `${totalAmount} SEK`;

      total.textContent =
        `${totalAmount} SEK`;

    }


    /* =========================
       CHANGE QUANTITY
    ========================== */

    function changeQuantity(index, amount) {

      if (!cart[index]) {
        return;
      }

      cart[index].quantity =
        Number(cart[index].quantity || 1) + amount;


      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }


      saveCart();

      renderCart();

    }


    /* =========================
       REMOVE ITEM
    ========================== */

    function removeItem(index) {

      cart.splice(index, 1);

      saveCart();

      renderCart();

    }


    /* =========================
       PROCEED TO CHECKOUT
    ========================== */

    checkoutButton.addEventListener(
      "click",
      () => {

        if (!cart.length) {

          alert(
            "Your cart is empty."
          );

          return;
        }


        /*
          Save the latest cart
          before opening payment page.
        */

        saveCart();


        /*
          Go directly to payment.html
        */

        window.location.href =
          "payment.html";

      }
    );


    /* =========================
       START
    ========================== */

    renderCart();

  </script>

</body>
</html>
