<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E&B SHOP - Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #292929;
      background: #050505;
    }

    .logo {
      color: #e3b82f;
      font-size: 30px;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    nav a:hover {
      color: #e3b82f;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 45px;
    }

    .hero h1 {
      color: #e3b82f;
      font-size: 50px;
      margin: 0 0 14px;
    }

    .hero p {
      color: #aeb6c2;
      font-size: 21px;
      margin: 0;
    }

    .cart-layout {
      width: 88%;
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      padding-bottom: 60px;
    }

    .cart-box,
    .summary-box {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 32px;
    }

    .box-title {
      color: #e3b82f;
      font-size: 32px;
      margin: 0 0 45px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 24px;
      align-items: center;
      padding-bottom: 25px;
      margin-bottom: 25px;
      border-bottom: 1px solid #292929;
    }

    .product-image {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
    }

    .placeholder-image {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .product-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-price {
      color: #e3b82f;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 17px;
    }

    .quantity-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #171717;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .quantity-btn:hover {
      border-color: #e3b82f;
      color: #e3b82f;
    }

    .quantity {
      font-size: 18px;
      min-width: 15px;
      text-align: center;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 16px;
      margin-left: 5px;
    }

    .remove-btn:hover {
      color: #ff5b5b;
    }

    .item-total {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 21px 0;
      border-bottom: 1px solid #292929;
      color: #bfc6d0;
      font-size: 19px;
    }

    .summary-row strong {
      color: white;
    }

    .free {
      color: #e3b82f !important;
      font-weight: 700;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 28px;
      font-weight: 800;
    }

    .total-price {
      color: #e3b82f;
    }

    .checkout-btn {
      width: 100%;
      height: 64px;
      margin-top: 40px;
      border: none;
      border-radius: 10px;
      background: #e3b82f;
      color: #080808;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #f0c83f;
    }

    .continue-shopping {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #e3b82f;
      text-decoration: none;
      font-size: 17px;
    }

    .continue-shopping:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 20px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 20px;
    }

    .error-message {
      text-align: center;
      padding: 40px 20px;
      color: #ff6b6b;
      font-size: 17px;
    }

    footer {
      border-top: 1px solid #292929;
      background: #050505;
      text-align: center;
      padding: 30px 20px;
      color: #777;
    }

    @media (max-width: 900px) {
      .cart-layout {
        grid-template-columns: 1fr;
        width: 94%;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 14px;
      }

      .hero h1 {
        font-size: 40px;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 0 4%;
      }

      .logo {
        font-size: 23px;
      }

      nav {
        gap: 8px;
      }

      nav a {
        font-size: 12px;
      }

      .cart-box,
      .summary-box {
        padding: 20px;
      }

      .cart-item {
        grid-template-columns: 80px 1fr;
        gap: 15px;
      }

      .product-image,
      .placeholder-image {
        width: 80px;
        height: 80px;
      }

      .item-total {
        grid-column: 2;
      }

      .product-name {
        font-size: 18px;
      }

      .quantity-area {
        gap: 8px;
        flex-wrap: wrap;
      }

      .quantity-btn {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">E&B SHOP</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Your Cart</h1>
    <p>Review your products before checkout.</p>
  </section>

  <main class="cart-layout">

    <section class="cart-box">
      <h2 class="box-title">
        Cart Items
        (<span id="itemCount">0</span>)
      </h2>

      <div id="cartItems">
        <div class="loading">
          Loading cart...
        </div>
      </div>
    </section>

    <section class="summary-box">

      <h2 class="box-title">
        Order Summary
      </h2>

      <div class="summary-row">
        <span>Items</span>
        <strong id="summaryItems">0</strong>
      </div>

      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">0 SEK</strong>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <strong class="free">FREE</strong>
      </div>

      <div class="total-row">
        <span>Total</span>
        <span class="total-price" id="total">
          0 SEK
        </span>
      </div>

      <button
        class="checkout-btn"
        id="checkoutButton"
        type="button"
      >
        Proceed to Checkout
      </button>

      <a
        href="products.html"
        class="continue-shopping"
      >
        ← Continue Shopping
      </a>

    </section>

  </main>

  <footer>
    © 2026 E&B SHOP. All rights reserved.
  </footer>

  <script type="module">

    import { supabase } from "./supabaseClient.js";

    const CART_KEY = "ebShopCart";

    const cartItems =
      document.getElementById("cartItems");

    const itemCount =
      document.getElementById("itemCount");

    const summaryItems =
      document.getElementById("summaryItems");

    const subtotal =
      document.getElementById("subtotal");

    const total =
      document.getElementById("total");

    const checkoutButton =
      document.getElementById("checkoutButton");

    let cart = [];

    function loadCart() {

      try {

        const saved =
          localStorage.getItem(CART_KEY);

        cart = saved
          ? JSON.parse(saved)
          : [];

        if (!Array.isArray(cart)) {
          cart = [];
        }

      } catch (error) {

        console.error(
          "Could not read cart:",
          error
        );

        cart = [];
      }
    }

    function saveCart() {

      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );
    }

    async function syncProductsFromSupabase() {

      if (!cart.length) {

        renderCart();

        return;
      }

      const productIds =
        cart
          .map(item => item.id)
          .filter(Boolean);

      if (!productIds.length) {

        renderCart();

        return;
      }

      try {

        const {
          data,
          error
        } = await supabase
          .from("products")
          .select(
            "id, name, price, stock, image"
          )
          .in(
            "id",
            productIds
          );

        if (error) {

          console.error(
            "Supabase cart error:",
            error
          );

          renderCart();

          return;
        }

        const products =
          Array.isArray(data)
            ? data
            : [];

        cart = cart
          .map(item => {

            const product =
              products.find(
                p =>
                  String(p.id) ===
                  String(item.id)
              );

            if (!product) {
              return null;
            }

            return {
              id: product.id,
              name: product.name,
              price:
                Number(product.price) || 0,
              stock:
                Number(product.stock) || 0,
              image:
                product.image || "",
              quantity:
                Number(item.quantity) || 1
            };

          })
          .filter(Boolean);

        saveCart();

        renderCart();

      } catch (error) {

        console.error(
          "Unexpected cart error:",
          error
        );

        renderCart();
      }
    }

    function renderCart() {

      cartItems.innerHTML = "";

      if (!cart.length) {

        cartItems.innerHTML = `
          <div class="empty">
            Your cart is empty.
            <br><br>
            <a
              href="products.html"
              style="color:#e3b82f;text-decoration:none;"
            >
              Start Shopping →
            </a>
          </div>
        `;

        itemCount.textContent = "0";
        summaryItems.textContent = "0";
        subtotal.textContent = "0 SEK";
        total.textContent = "0 SEK";

        return;
      }

      let totalItems = 0;
      let totalPrice = 0;

      cart.forEach(
        (item, index) => {

          const quantity =
            Number(item.quantity) || 1;

          const price =
            Number(item.price) || 0;

          const itemTotal =
            price * quantity;

          totalItems += quantity;
          totalPrice += itemTotal;

          let imageHTML;

          if (item.image) {

            imageHTML = `
              <img
                class="product-image"
                src="${escapeHtml(item.image)}"
                alt="${escapeHtml(item.name)}"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="placeholder-image"
                style="display:none;"
              >
                🛍️
              </div>
            `;

          } else {

            imageHTML = `
              <div class="placeholder-image">
                🛍️
              </div>
            `;
          }

          cartItems.innerHTML += `
            <div class="cart-item">

              ${imageHTML}

              <div>

                <div class="product-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="product-price">
                  ${formatPrice(item.price)}
                </div>

                <div class="quantity-area">

                  <button
                    class="quantity-btn"
                    type="button"
                    onclick="changeQuantity(${index}, -1)"
                  >
                    −
                  </button>

                  <span class="quantity">
                    ${quantity}
                  </span>

                  <button
                    class="quantity-btn"
                    type="button"
                    onclick="changeQuantity(${index}, 1)"
                  >
                    +
                  </button>

                  <button
                    class="remove-btn"
                    type="button"
                    onclick="removeItem(${index})"
                  >
                    Remove
                  </button>

                </div>

              </div>

              <div class="item-total">
                ${formatPrice(itemTotal)}
              </div>

            </div>
          `;
        }
      );

      itemCount.textContent =
        totalItems;

      summaryItems.textContent =
        totalItems;

      subtotal.textContent =
        formatPrice(totalPrice);

      total.textContent =
        formatPrice(totalPrice);
    }

    window.changeQuantity =
      function(index, amount) {

        if (!cart[index]) {
          return;
        }

        const current =
          Number(
            cart[index].quantity
          ) || 1;

        const newQuantity =
          current + amount;

        const stock =
          Number(
            cart[index].stock
          ) || 0;

        if (
          amount > 0 &&
          stock > 0 &&
          newQuantity > stock
        ) {

          alert(
            "You reached the available stock."
          );

          return;
        }

        if (newQuantity <= 0) {

          cart.splice(index, 1);

        } else {

          cart[index].quantity =
            newQuantity;
        }

        saveCart();

        renderCart();
      };

    window.removeItem =
      function(index) {

        if (!cart[index]) {
          return;
        }

        cart.splice(index, 1);

        saveCart();

        renderCart();
      };

    checkoutButton.addEventListener(
      "click",
      function() {

        if (!cart.length) {

          alert(
            "Your cart is empty."
          );

          return;
        }

        saveCart();

        window.location.href =
          "payment.html";
      }
    );

    function formatPrice(price) {

      return (
        Number(price || 0)
          .toLocaleString(
            "sv-SE",
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          )
        + " SEK"
      );
    }

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }

    loadCart();

    syncProductsFromSupabase();

  </script>

</body>
</html>
