<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E&B SHOP - Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #292929;
      background: #050505;
    }

    .logo {
      color: #e3b82f;
      font-size: 30px;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    nav a:hover {
      color: #e3b82f;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 45px;
    }

    .hero h1 {
      color: #e3b82f;
      font-size: 50px;
      margin: 0 0 14px;
    }

    .hero p {
      color: #aeb6c2;
      font-size: 21px;
      margin: 0;
    }

    .cart-layout {
      width: 88%;
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      padding-bottom: 60px;
    }

    .cart-box,
    .summary-box {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 32px;
    }

    .box-title {
      color: #e3b82f;
      font-size: 32px;
      margin: 0 0 45px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 24px;
      align-items: center;
      padding-bottom: 25px;
      margin-bottom: 25px;
      border-bottom: 1px solid #292929;
    }

    .product-image {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
    }

    .product-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-price {
      color: #e3b82f;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 17px;
    }

    .quantity-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #171717;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .quantity-btn:hover {
      border-color: #e3b82f;
      color: #e3b82f;
    }

    .quantity {
      font-size: 18px;
      min-width: 15px;
      text-align: center;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 16px;
      margin-left: 5px;
    }

    .remove-btn:hover {
      color: #ff5b5b;
    }

    .item-total {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 21px 0;
      border-bottom: 1px solid #292929;
      color: #bfc6d0;
      font-size: 19px;
    }

    .summary-row strong {
      color: white;
    }

    .free {
      color: #e3b82f !important;
      font-weight: 700;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 28px;
      font-weight: 800;
    }

    .total-price {
      color: #e3b82f;
    }

    .checkout-btn {
      width: 100%;
      height: 64px;
      margin-top: 40px;
      border: none;
      border-radius: 10px;
      background: #e3b82f;
      color: #080808;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #f0c83f;
    }
