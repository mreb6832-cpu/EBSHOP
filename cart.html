<script type="module">
  import { supabase } from "./supabaseClient.js";

  const CART_KEY = "ebShopCart";

  let cart = [];

  const cartItems =
    document.getElementById("cartItems");

  const itemCount =
    document.getElementById("itemCount");

  const subtotal =
    document.getElementById("subtotal");

  const total =
    document.getElementById("total");

  const checkoutButton =
    document.getElementById("checkoutButton");


  /* =========================
     LOAD CART
  ========================== */

  function loadCart() {
    try {
      cart =
        JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch {
      cart = [];
    }
  }


  /* =========================
     SAVE CART
  ========================== */

  function saveCart() {
    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );
  }


  /* =========================
     LOAD PRODUCT DATA
     FROM SUPABASE
  ========================== */

  async function syncProductsFromSupabase() {
    if (!cart.length) {
      renderCart();
      return;
    }

    const productIds = cart
      .map(item => item.id)
      .filter(Boolean);

    if (!productIds.length) {
      renderCart();
      return;
    }

    try {
      const { data, error } = await supabase
        .from("products")
        .select(
          "id, name, price, stock, image"
        )
        .in("id", productIds);

      if (error) {
        console.error(
          "Could not load cart products:",
          error
        );

        renderCart();
        return;
      }

      const products =
        Array.isArray(data)
          ? data
          : [];

      cart = cart.filter(item => {
        const product =
          products.find(
            product =>
              String(product.id) ===
              String(item.id)
          );

        if (!product) {
          return false;
        }

        item.name =
          product.name;

        item.price =
          Number(product.price) || 0;

        item.image =
          product.image || "";

        item.stock =
          Number(product.stock) || 0;

        return true;
      });

      saveCart();

      renderCart();

    } catch (error) {
      console.error(
        "Unexpected product loading error:",
        error
      );

      renderCart();
    }
  }


  /* =========================
     ESCAPE HTML
  ========================== */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     RENDER CART
  ========================== */

  function renderCart() {
    cartItems.innerHTML = "";

    let totalAmount = 0;
    let totalItems = 0;

    if (!cart.length) {
      cartItems.innerHTML = `
        <div class="empty">
          Your cart is empty.
        </div>
      `;

      itemCount.textContent = "0";
      subtotal.textContent = "0 SEK";
      total.textContent = "0 SEK";

      return;
    }


    cart.forEach((item, index) => {
      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 1;

      const itemTotal =
        price * quantity;

      totalAmount += itemTotal;
      totalItems += quantity;


      const image =
        item.image || "";

      const name =
        item.name ||
        "E&B SHOP Product";


      const imageHTML =
        image
          ? `
            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
            >
          `
          : `
            <div
              class="product-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                color:#777;
                font-size:30px;
              "
            >
              🛍️
            </div>
          `;


      cartItems.innerHTML += `
        <div class="cart-item">

          ${imageHTML}

          <div>

            <div class="product-name">
              ${escapeHtml(name)}
            </div>

            <div class="product-price">
              ${price.toLocaleString("sv-SE")} SEK
            </div>

            <div class="quantity-area">

              <button
                class="quantity-btn"
                onclick="changeQuantity(${index}, -1)"
                type="button"
              >
                −
              </button>

              <span class="quantity">
                ${quantity}
              </span>

              <button
                class="quantity-btn"
                onclick="changeQuantity(${index}, 1)"
                type="button"
              >
                +
              </button>

              <button
                class="remove-btn"
                onclick="removeItem(${index})"
                type="button"
              >
                Remove
              </button>

            </div>

          </div>

          <div class="item-total">
            ${itemTotal.toLocaleString("sv-SE")} SEK
          </div>

        </div>
      `;
    });


    itemCount.textContent =
      totalItems;

    subtotal.textContent =
      `${totalAmount.toLocaleString("sv-SE")} SEK`;

    total.textContent =
      `${totalAmount.toLocaleString("sv-SE")} SEK`;
  }


  /* =========================
     CHANGE QUANTITY
  ========================== */

  window.changeQuantity =
    function(index, amount) {
      if (!cart[index]) {
        return;
      }

      const currentQuantity =
        Number(
          cart[index].quantity
        ) || 1;

      const newQuantity =
        currentQuantity + amount;

      const stock =
        Number(
          cart[index].stock
        ) || 0;

      if (amount > 0 && stock > 0) {
        if (newQuantity > stock) {
          alert(
            "You reached the available stock."
          );
          return;
        }
      }

      cart[index].quantity =
        newQuantity;

      if (
        cart[index].quantity <= 0
      ) {
        cart.splice(index, 1);
      }

      saveCart();

      renderCart();
    };


  /* =========================
     REMOVE ITEM
  ========================== */

  window.removeItem =
    function(index) {
      if (!cart[index]) {
        return;
      }

      cart.splice(index, 1);

      saveCart();

      renderCart();
    };


  /* =========================
     PROCEED TO CHECKOUT
  ========================== */

  checkoutButton.addEventListener(
    "click",
    () => {
      if (!cart.length) {
        alert(
          "Your cart is empty."
        );

        return;
      }

      saveCart();

      window.location.href =
        "payment.html";
    }
  );


  /* =========================
     START
  ========================== */

  loadCart();

  syncProductsFromSupabase();
</script>
