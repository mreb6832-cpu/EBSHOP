<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart | E&B SHOP</title>

  <meta
    name="description"
    content="Review your shopping cart at E&B SHOP."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #fff;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: #111;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      min-height: 75px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo span {
      color: #d4af37;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #ddd;
      font-size: 14px;
    }

    nav a:hover {
      color: #d4af37;
    }

    .cart-link {
      background: #d4af37;
      color: #000;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 800;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px 80px;
    }

    .page-heading {
      margin-bottom: 30px;
    }

    .page-heading h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .page-heading h1 span {
      color: #d4af37;
    }

    .page-heading p {
      color: #888;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 25px;
      align-items: start;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .cart-item {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 13px;
      padding: 15px;
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 18px;
      align-items: center;
    }

    .item-image {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      background: #202020;
      display: block;
    }

    .no-image {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      background: #202020;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      color: #666;
    }

    .item-info h2 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .item-category {
      color: #d4af37;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .item-price {
      color: #aaa;
      font-size: 14px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      margin-top: 12px;
    }

    .quantity-control button {
      width: 35px;
      height: 35px;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity-control button:hover {
      color: #d4af37;
      border-color: #d4af37;
    }

    .quantity {
      width: 48px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #181818;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      font-weight: 700;
    }

    .item-right {
      text-align: right;
    }

    .item-total {
      color: #d4af37;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-weight: 700;
    }

    .remove-btn:hover {
      color: #ff7777;
    }

    .summary {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 23px;
      position: sticky;
      top: 100px;
    }

    .summary h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #252525;
      color: #aaa;
    }

    .summary-row strong {
      color: #fff;
    }

    .delivery {
      color: #8dcc8d !important;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 20px 0;
      font-size: 22px;
      font-weight: 800;
    }

    .total-row strong {
      color: #d4af37;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #d4af37;
      color: #000;
      padding: 15px;
      border-radius: 9px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .checkout-btn:hover {
      background: #f0cf55;
    }

    .continue-btn {
      display: block;
      width: 100%;
      text-align: center;
      border: 1px solid #444;
      padding: 13px;
      border-radius: 9px;
      color: #fff;
      font-weight: 700;
    }

    .continue-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .empty-cart {
      text-align: center;
      background: #121212;
      border: 1px dashed #333;
      border-radius: 14px;
      padding: 80px 20px;
    }

    .empty-cart-icon {
      font-size: 65px;
      margin-bottom: 18px;
    }

    .empty-cart h2 {
      margin-bottom: 10px;
    }

    .empty-cart p {
      color: #888;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      background: #d4af37;
      color: #000;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #d4af37;
      color: #000;
      padding: 14px 18px;
      border-radius: 9px;
      font-weight: 800;
      display: none;
      z-index: 9999;
    }

    footer {
      border-top: 1px solid #292929;
      background: #101010;
      padding: 30px 20px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .navbar {
        flex-direction: column;
      }

      .cart-layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 15px 60px;
      }

      .page-heading h1 {
        font-size: 30px;
      }

      .cart-item {
        grid-template-columns: 80px 1fr;
        gap: 12px;
      }

      .item-image,
      .no-image {
        width: 80px;
        height: 80px;
      }

      .item-right {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        padding-top: 5px;
      }

      .item-total {
        margin-bottom: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="navbar">

    <a href="index.html" class="logo">
      🛒 <span>E&B</span> SHOP
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="account.html">My Account</a>
      <a href="orders.html">Orders</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>

      <a href="cart.html" class="cart-link">
        🛒 Cart (<span id="cartCount">0</span>)
      </a>
    </nav>

  </div>
</header>


<main class="container">

  <div class="page-heading">

    <h1>
      Shopping <span>Cart</span>
    </h1>

    <p>
      Review your products before checkout.
    </p>

  </div>


  <div id="cartContent"></div>

</main>


<footer>
  © 2026 E&B SHOP — Sweden 🇸🇪
</footer>


<div id="toast" class="toast"></div>


<script>

  const CART_KEY = "ebShopCart";
  const PRODUCTS_KEY = "ebShopProducts";

  const cartContent =
    document.getElementById("cartContent");

  const cartCount =
    document.getElementById("cartCount");

  const toast =
    document.getElementById("toast");


  let cart = [];
  let products = [];


  function loadData() {

    try {

      cart =
        JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch {

      cart = [];

    }


    try {

      products =
        JSON.parse(
          localStorage.getItem(PRODUCTS_KEY) || "[]"
        );

      if (!Array.isArray(products)) {
        products = [];
      }

    } catch {

      products = [];

    }

  }


  function saveCart() {

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

  }


  function getProduct(productId) {

    return products.find(
      product =>
        String(product.id) ===
        String(productId)
    );

  }


  function updateCartCount() {

    const count =
      cart.reduce(
        (total, item) =>
          total +
          (Number(item.quantity) || 0),
        0
      );

    cartCount.textContent = count;

  }


  function formatPrice(price) {

    return (
      Number(price || 0)
        .toLocaleString(
          "sv-SE",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      + " SEK"
    );

  }


  function calculateSubtotal() {

    return cart.reduce(
      (total, item) => {

        return (
          total +
          (
            Number(item.price) || 0
          ) *
          (
            Number(item.quantity) || 0
          )
        );

      },
      0
    );

  }


  function renderCart() {

    updateCartCount();


    if (cart.length === 0) {

      cartContent.innerHTML = `

        <div class="empty-cart">

          <div class="empty-cart-icon">
            🛒
          </div>

          <h2>
            Your Cart Is Empty
          </h2>

          <p>
            You haven't added any products yet.
          </p>

          <a
            href="products.html"
            class="shop-btn"
          >
            Start Shopping
          </a>

        </div>

      `;

      return;

    }


    const subtotal =
      calculateSubtotal();


    /*
     * Delivery is currently free.
     * Payment will be connected later.
     */

    const delivery = 0;

    const total =
      subtotal + delivery;


    cartContent.innerHTML = `

      <div class="cart-layout">

        <section class="cart-items">

          ${cart.map(
            item =>
              createCartItem(item)
          ).join("")}

        </section>


        <aside class="summary">

          <h2>
            Order Summary
          </h2>


          <div class="summary-row">

            <span>
              Subtotal
            </span>

            <strong>
              ${formatPrice(subtotal)}
            </strong>

          </div>


          <div class="summary-row">

            <span>
              Delivery
            </span>

            <strong class="delivery">
              FREE
            </strong>

          </div>


          <div class="total-row">

            <span>
              Total
            </span>

            <strong>
              ${formatPrice(total)}
            </strong>

          </div>


          <a
            href="checkout.html"
            class="checkout-btn"
          >
            Proceed to Checkout
          </a>


          <a
            href="products.html"
            class="continue-btn"
          >
            Continue Shopping
          </a>

        </aside>

      </div>

    `;


    addImageErrorHandlers();

  }


  function createCartItem(item) {

    const product =
      getProduct(item.id);


    const name =
      escapeHtml(
        item.name ||
        (product && product.name) ||
        "Product"
      );


    const category =
      escapeHtml(
        (product && product.category) ||
        "Product"
      );


    const quantity =
      Number(item.quantity) || 1;


    const price =
      Number(item.price) || 0;


    const itemTotal =
      price * quantity;


    let imageHTML;


    if (product && product.image) {

      imageHTML = `

        <img
          class="item-image"
          src="${escapeHtml(product.image)}"
          alt="${name}"
        >

        <div
          class="no-image"
          style="display:none;"
        >
          🛍️
        </div>

      `;

    } else {

      imageHTML = `

        <div class="no-image">
          🛍️
        </div>

      `;

    }


    return `

      <article class="cart-item">

        <div>
          ${imageHTML}
        </div>


        <div class="item-info">

          <div class="item-category">
            ${category}
          </div>


          <h2>
            ${name}
          </h2>


          <div class="item-price">
            ${formatPrice(price)}
            each
          </div>


          <div class="quantity-control">

            <button
              type="button"
              data-action="decrease"
              data-id="${escapeHtml(item.id)}"
            >
              −
            </button>


            <div class="quantity">
              ${quantity}
            </div>


            <button
              type="button"
              data-action="increase"
              data-id="${escapeHtml(item.id)}"
            >
              +
            </button>

          </div>

        </div>


        <div class="item-right">

          <div class="item-total">
            ${formatPrice(itemTotal)}
          </div>


          <button
            type="button"
            class="remove-btn"
            data-action="remove"
            data-id="${escapeHtml(item.id)}"
          >
            🗑️ Remove
          </button>

        </div>

      </article>

    `;

  }


  function addImageErrorHandlers() {

    document
      .querySelectorAll(".item-image")
      .forEach(
        image => {

          image.addEventListener(
            "error",
            function () {

              this.style.display =
                "none";


              const fallback =
                this.nextElementSibling;


              if (fallback) {

                fallback.style.display =
                  "flex";

              }

            }
          );

        }
      );

  }


  /*
   * CART BUTTONS
   */

  cartContent.addEventListener(
    "click",
    function (event) {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if (!button) {
        return;
      }


      const action =
        button.dataset.action;


      const id =
        button.dataset.id;


      if (action === "increase") {

        changeQuantity(
          id,
          1
        );

      }


      if (action === "decrease") {

        changeQuantity(
          id,
          -1
        );

      }


      if (action === "remove") {

        removeItem(id);

      }

    }
  );


  function changeQuantity(
    productId,
    amount
  ) {

    const item =
      cart.find(
        cartItem =>
          String(cartItem.id) ===
          String(productId)
      );


    if (!item) {
      return;
    }


    const product =
      getProduct(productId);


    const stock =
      product
        ? Number(product.stock) || 0
        : 999999;


    const current =
      Number(item.quantity) || 1;


    const newQuantity =
      current + amount;


    if (newQuantity <= 0) {

      removeItem(productId);

      return;

    }


    if (
      product &&
      newQuantity > stock
    ) {

      showToast(
        "You reached the available stock."
      );

      return;

    }


    item.quantity =
      newQuantity;


    saveCart();

    renderCart();

  }


  function removeItem(productId) {

    const item =
      cart.find(
        cartItem =>
          String(cartItem.id) ===
          String(productId)
      );


    cart =
      cart.filter(
        cartItem =>
          String(cartItem.id) !==
          String(productId)
      );


    saveCart();

    renderCart();


    if (item) {

      showToast(
        item.name +
        " removed from cart."
      );

    }

  }


  function showToast(text) {

    toast.textContent =
      text;


    toast.style.display =
      "block";


    clearTimeout(
      window.toastTimer
    );


    window.toastTimer =
      setTimeout(
        function () {

          toast.style.display =
            "none";

        },
        2500
      );

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
   * START
   */

  loadData();

  renderCart();

</script>

</body>
</html>
