<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — E&B SHOP</title>

  <meta
    name="description"
    content="Login to your E&B SHOP customer account."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #f5b82e;
      --gold-light: #ffd76a;
      --black: #050505;
      --gray: #888;
      --light: #f5f5f5;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      min-height: 100vh;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    header {
      background: #050505;
      color: white;
      border-bottom: 1px solid #222;
    }

    .nav {
      width: min(1180px, 92%);
      min-height: 76px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
    }

    .logo span {
      color: var(--gold);
    }

    .back {
      color: #ddd;
      font-size: 14px;
    }

    .back:hover {
      color: var(--gold);
    }

    /* MAIN */

    main {
      min-height: calc(100vh - 126px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 45px 20px;
    }

    .login-box {
      width: min(460px, 100%);
      background: white;
      padding: 45px;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }

    .login-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fff7df;
      border: 1px solid #f0cd75;
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    .login-box h1 {
      text-align: center;
      font-size: 31px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 49px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 0 15px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,184,46,.12);
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .password-row label {
      margin-bottom: 0;
    }

    .forgot {
      font-size: 12px;
      color: #9a700e;
      font-weight: 700;
    }

    .login-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 9px;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
      transition: .2s;
    }

    .login-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a00000;
      border: 1px solid #ffcaca;
    }

    .message.success {
      display: block;
      background: #effbea;
      color: #267326;
      border: 1px solid #c8e9c8;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #aaa;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e5e5e5;
      flex: 1;
    }

    .register-text {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .register-text a {
      color: #9a700e;
      font-weight: 800;
    }

    /* FOOTER */

    footer {
      background: #050505;
      color: #777;
      text-align: center;
      padding: 18px;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 32px 23px;
      }

      .nav {
        min-height: 68px;
      }

      .logo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="nav">

      <a href="index.html" class="logo">
        🛒 <span>E&B</span> SHOP
      </a>

      <a href="index.html" class="back">
        ← Back to Shop
      </a>

    </div>
  </header>


  <!-- LOGIN -->

  <main>

    <div class="login-box">

      <div class="login-icon">
        🔐
      </div>

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your E&B SHOP account.
      </p>


      <div id="message" class="message"></div>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <div class="password-row">

            <label for="password">
              Password
            </label>

            <a href="#" class="forgot" onclick="forgotPassword(event)">
              Forgot password?
            </a>

          </div>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

        </div>


        <button
          type="submit"
          class="login-btn"
        >
          Login →
        </button>

      </form>


      <div class="divider">
        OR
      </div>


      <p class="register-text">
        Don't have an account?
        <a href="register.html">
          Create Account
        </a>
      </p>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>
    © 2026 E&B SHOP. All rights reserved. 🇸🇪
  </footer>


  <!-- JAVASCRIPT -->

  <script>

    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");


    loginForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.className = "message";
      message.textContent = "";


      if (!email || !password) {

        message.className = "message error";

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      /*
        TEMPORARY LOGIN

        Real authentication will be connected
        to the E&B SHOP database later.
      */


      const savedEmail =
        localStorage.getItem("ebShopCustomerEmail");


      if (
        savedEmail &&
        savedEmail.toLowerCase() === email.toLowerCase()
      ) {

        localStorage.setItem(
          "ebShopLoggedIn",
          "true"
        );

        message.className =
          "message success";

        message.textContent =
          "Login successful. Opening your account...";


        setTimeout(function() {

          window.location.href =
            "account.html";

        }, 1000);

      } else {

        message.className =
          "message error";

        message.textContent =
          "Account not found. Please register first.";

      }

    });


    function forgotPassword(event) {

      event.preventDefault();

      alert(
        "Password recovery will be connected when the real account system is added."
      );

    }

  </script>

</body>
</html>
