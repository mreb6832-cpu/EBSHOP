<script type="module">
  import { supabase } from "./supabaseClient.js";

  const ADMIN_EMAIL = "mucyoemmy539@gmail.com";

  async function checkAdminAccess() {
    const accessDenied = document.getElementById("accessDenied");
    const page = document.getElementById("page");

    try {
      const {
        data: { user },
        error: authError
      } = await supabase.auth.getUser();

      if (authError || !user) {
        accessDenied.style.display = "block";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

        return false;
      }

      // Check admin email first
      if (
        !user.email ||
        user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
      ) {
        accessDenied.style.display = "block";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

        return false;
      }

      // Check that the admin exists in the admins table
      const {
        data: admin,
        error: adminError
      } = await supabase
        .from("admins")
        .select("id, email")
        .eq("email", ADMIN_EMAIL)
        .maybeSingle();

      if (adminError) {
        console.error("Admin check error:", adminError);

        accessDenied.style.display = "block";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

        return false;
      }

      if (!admin) {
        accessDenied.style.display = "block";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

        return false;
      }

      // Admin verified
      page.style.display = "block";

      return true;

    } catch (error) {
      console.error("Admin access error:", error);

      accessDenied.style.display = "block";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);

      return false;
    }
  }

  // Keep the rest of your existing admin-products.js code below this point.

  const isAdmin = await checkAdminAccess();

  if (isAdmin) {
    await loadProducts();
  }
</script>
