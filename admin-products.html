<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Products | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      font-size: 22px;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #374151;
      padding: 10px 15px;
      border-radius: 8px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .box h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    input[type="file"] {
      background: white;
      cursor: pointer;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .image-preview {
      display: none;
      margin-top: 12px;
      width: 180px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .btn {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #111827;
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cancel {
      background: #6b7280;
      display: none;
      margin-left: 8px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eee;
    }

    .product-content {
      padding: 16px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .stock {
      color: #555;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .edit {
      background: #2563eb;
    }

    .delete {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 30px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    #accessDenied {
      display: none;
      text-align: center;
      padding: 80px 20px;
    }

    #page {
      display: none;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      header {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- ACCESS DENIED -->
  <div id="accessDenied">
    <h1>🚫 Access Denied</h1>
    <p>Only the E&B SHOP Owner can access this page.</p>
  </div>


  <!-- MAIN PAGE -->
  <div id="page">

    <header>
      <h1>📦 Manage Products</h1>

      <a href="admin.html" class="back">
        ← Owner Dashboard
      </a>
    </header>


    <main class="container">

      <!-- ADD / EDIT PRODUCT -->
      <section class="box">

        <h2 id="formTitle">➕ Add New Product</h2>

        <div id="message" class="message"></div>

        <form id="productForm">

          <div class="form-grid">

            <input
              type="text"
              id="productName"
              placeholder="Product name"
              required
            >

            <input
              type="number"
              id="productPrice"
              placeholder="Price in SEK"
              min="0"
              step="0.01"
              required
            >

            <input
              type="number"
              id="productStock"
              placeholder="Stock quantity"
              min="0"
              required
            >

            <select id="productCategory" required>
              <option value="">Select category</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Shoes">Shoes</option>
              <option value="Home">Home</option>
              <option value="Beauty">Beauty</option>
              <option value="Gaming">Gaming</option>
              <option value="Kids">Kids</option>
              <option value="Other">Other</option>
            </select>


            <!-- PRODUCT IMAGE -->
            <div class="full">

              <label
                for="productImage"
                style="display:block;margin-bottom:8px;font-weight:bold;"
              >
                Product Image
              </label>

              <input
                type="file"
                id="productImage"
                accept="image/*"
              >

              <small
                style="display:block;margin-top:7px;color:#666;"
              >
                Choose a product image from your computer.
              </small>

              <img
                id="imagePreview"
                class="image-preview"
                alt="Image preview"
              >

            </div>


            <textarea
              id="productDescription"
              class="full"
              placeholder="Product description"
            ></textarea>


            <div class="full">

              <button
                type="submit"
                class="btn"
                id="saveButton"
              >
                Add Product
              </button>

              <button
                type="button"
                class="btn cancel"
                id="cancelButton"
              >
                Cancel
              </button>

            </div>

          </div>

        </form>

      </section>


      <!-- PRODUCT LIST -->
      <section class="box">

        <h2>🛍️ Your Products</h2>

        <div
          id="productList"
          class="products"
        ></div>

      </section>

    </main>

  </div>


  <!-- SUPABASE -->
  <script type="module">

    import {
      supabase
    } from "./supabaseClient.js";


    /* =========================
       OWNER ACCESS
    ========================= */

    const ADMIN_EMAIL =
      "mucyoemmy973@gmail.com";


    const currentEmail =
      localStorage.getItem(
        "ebShopCustomerEmail"
      );


    if (
      !currentEmail ||
      currentEmail.trim().toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      document.getElementById(
        "accessDenied"
      ).style.display = "block";


      setTimeout(() => {

        window.location.href =
          "index.html";

      }, 1500);

    } else {

      document.getElementById(
        "page"
      ).style.display = "block";

    }


    /* =========================
       VARIABLES
    ========================= */

    let products = [];

    let editingId = null;

    let oldImageUrl = "";


    /* =========================
       ELEMENTS
    ========================= */

    const form =
      document.getElementById(
        "productForm"
      );

    const productList =
      document.getElementById(
        "productList"
      );

    const imageInput =
      document.getElementById(
        "productImage"
      );

    const imagePreview =
      document.getElementById(
        "imagePreview"
      );

    const messageBox =
      document.getElementById(
        "message"
      );


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      message,
      type = "success"
    ) {

      messageBox.textContent =
        message;

      messageBox.className =
        "message " + type;

      messageBox.style.display =
        "block";


      setTimeout(() => {

        messageBox.style.display =
          "none";

      }, 5000);

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      productList.innerHTML = `
        <div class="loading">
          Loading products...
        </div>
      `;


      const {
        data,
        error
      } = await supabase
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(
          "Load products error:",
          error
        );

        productList.innerHTML = `
          <div class="empty">
            Failed to load products.
          </div>
        `;

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      products = data || [];

      renderProducts();

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      if (
        products.length === 0
      ) {

        productList.innerHTML = `
          <div class="empty">
            No products yet. Add your first product above.
          </div>
        `;

        return;
      }


      productList.innerHTML =
        products.map(product => {

          const image =
            product.image ||
            "https://via.placeholder.com/500x350?text=E%26B+SHOP";


          return `

            <div class="product">

              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
              >

              <div class="product-content">

                <h3>
                  ${escapeHtml(product.name)}
                </h3>

                <div class="price">
                  ${Number(product.price || 0).toFixed(2)} SEK
                </div>

                <div>
                  Category:
                  ${escapeHtml(product.category || "")}
                </div>

                <div class="stock">
                  Stock:
                  ${Number(product.stock || 0)}
                </div>

                <p>
                  ${escapeHtml(product.description || "")}
                </p>

                <br>

                <div class="actions">

                  <button
                    class="btn edit"
                    data-id="${escapeHtml(product.id)}"
                  >
                    ✏️ Edit
                  </button>

                  <button
                    class="btn delete"
                    data-id="${escapeHtml(product.id)}"
                  >
                    🗑️ Delete
                  </button>

                </div>

              </div>

            </div>

          `;

        }).join("");


      /* EDIT BUTTONS */

      document
        .querySelectorAll(".edit")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              editProduct(
                button.dataset.id
              );

            }
          );

        });


      /* DELETE BUTTONS */

      document
        .querySelectorAll(".delete")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              deleteProduct(
                button.dataset.id
              );

            }
          );

        });

    }


    /* =========================
       IMAGE PREVIEW
    ========================= */

    imageInput.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) {

          imagePreview.style.display =
            "none";

          return;

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          showMessage(
            "Please choose an image file.",
            "error"
          );

          this.value = "";

          return;

        }


        const maxSize =
          5 * 1024 * 1024;


        if (
          file.size > maxSize
        ) {

          showMessage(
            "Image must be smaller than 5 MB.",
            "error"
          );

          this.value = "";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            imagePreview.src =
              event.target.result;

            imagePreview.style.display =
              "block";

          };


        reader.readAsDataURL(file);

      }
    );


    /* =========================
       UPLOAD IMAGE
    ========================= */

    async function uploadImage(
      file
    ) {

      if (!file) {
        return null;
      }


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const filePath =
        fileName;


      const {
        error
      } = await supabase
        .storage
        .from("product-images")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


      if (error) {

        console.error(
          "Image upload error:",
          error
        );

        throw error;

      }


      const {
        data
      } = supabase
        .storage
        .from("product-images")
        .getPublicUrl(
          filePath
        );


      return data.publicUrl;

    }


    /* =========================
       DELETE OLD IMAGE
    ========================= */

    async function deleteStorageImage(
      imageUrl
    ) {

      if (!imageUrl) {
        return;
      }


      if (
        !imageUrl.includes(
          "/storage/v1/object/public/product-images/"
        )
      ) {

        return;

      }


      try {

        const marker =
          "/storage/v1/object/public/product-images/";

        const path =
          imageUrl.split(marker)[1];


        if (!path) {
          return;
        }


        await supabase
          .storage
          .from("product-images")
          .remove([path]);

      } catch (error) {

        console.warn(
          "Could not delete old image:",
          error
        );

      }

    }


    /* =========================
       ADD / UPDATE PRODUCT
    ========================= */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const saveButton =
          document.getElementById(
            "saveButton"
          );


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Saving...";


        try {

          const name =
            document
              .getElementById(
                "productName"
              )
              .value
              .trim();


          const price =
            Number(
              document
                .getElementById(
                  "productPrice"
                )
                .value
            );


          const stock =
            Number(
              document
                .getElementById(
                  "productStock"
                )
                .value
            );


          const category =
            document
              .getElementById(
                "productCategory"
              )
              .value;


          const description =
            document
              .getElementById(
                "productDescription"
              )
              .value
              .trim();


          const selectedFile =
            imageInput.files[0];


          /* VALIDATION */

          if (!name) {

            throw new Error(
              "Please enter a product name."
            );

          }


          if (
            Number.isNaN(price) ||
            price < 0
          ) {

            throw new Error(
              "Please enter a valid price."
            );

          }


          if (
            Number.isNaN(stock) ||
            stock < 0
          ) {

            throw new Error(
              "Please enter a valid stock quantity."
            );

          }


          if (!category) {

            throw new Error(
              "Please select a category."
            );

          }


          /* =========================
             UPDATE PRODUCT
          ========================= */

          if (editingId) {

            let imageUrl =
              oldImageUrl;


            /* Upload new image */

            if (selectedFile) {

              imageUrl =
                await uploadImage(
                  selectedFile
                );

            }


            const {
              error
            } = await supabase
              .from("products")
              .update({

                name,
                price,
                stock,
                category,
                image: imageUrl,
                description

              })
              .eq(
                "id",
                editingId
              );


            if (error) {

              throw error;

            }


            /* Delete old image */

            if (
              selectedFile &&
              oldImageUrl &&
              oldImageUrl !== imageUrl
            ) {

              await deleteStorageImage(
                oldImageUrl
              );

            }


            showMessage(
              "Product updated successfully."
            );

          }


          /* =========================
             ADD PRODUCT
          ========================= */

          else {

            let imageUrl =
              null;


            if (selectedFile) {

              imageUrl =
                await uploadImage(
                  selectedFile
                );

            }


            const {
              error
            } = await supabase
              .from("products")
              .insert({

                name,
                price,
                stock,
                category,
                image: imageUrl,
                description

              });


            if (error) {

              /* If database insert fails,
                 remove uploaded image */

              if (imageUrl) {

                await deleteStorageImage(
                  imageUrl
                );

              }

              throw error;

            }


            showMessage(
              "Product added successfully."
            );

          }


          resetForm();

          await loadProducts();

        } catch (error) {

          console.error(
            "Save product error:",
            error
          );

          showMessage(
            error.message ||
            "Something went wrong.",
            "error"
          );

        } finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            editingId
              ? "Update Product"
              : "Add Product";

        }

      }
    );


    /* =========================
       EDIT PRODUCT
    ========================= */

    function editProduct(id) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(id)
        );


      if (!product) {
        return;
      }


      editingId =
        product.id;


      oldImageUrl =
        product.image || "";


      document.getElementById(
        "productName"
      ).value =
        product.name || "";


      document.getElementById(
        "productPrice"
      ).value =
        product.price || 0;


      document.getElementById(
        "productStock"
      ).value =
        product.stock || 0;


      document.getElementById(
        "productCategory"
      ).value =
        product.category || "";


      document.getElementById(
        "productDescription"
      ).value =
        product.description || "";


      imageInput.value =
        "";


      if (product.image) {

        imagePreview.src =
          product.image;

        imagePreview.style.display =
          "block";

      } else {

        imagePreview.style.display =
          "none";

      }


      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ Edit Product";


      document.getElementById(
        "saveButton"
      ).textContent =
        "Update Product";


      document.getElementById(
        "cancelButton"
      ).style.display =
        "inline-block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       DELETE PRODUCT
    ========================= */

    async function deleteProduct(id) {

      const product =
        products.find(
          item =>
            String(item.id) ===
            String(id)
        );


      if (!product) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${product.name}"?`
        );


      if (!confirmed) {
        return;
      }


      try {

        const {
          error
        } = await supabase
          .from("products")
          .delete()
          .eq(
            "id",
            id
          );


        if (error) {

          throw error;

        }


        /* Delete product image */

        if (product.image) {

          await deleteStorageImage(
            product.image
          );

        }


        showMessage(
          "Product deleted successfully."
        );


        await loadProducts();

      } catch (error) {

        console.error(
          "Delete error:",
          error
        );

        showMessage(
          error.message ||
          "Could not delete product.",
          "error"
        );

      }

    }


    /* =========================
       RESET FORM
    ========================= */

    function resetForm() {

      editingId =
        null;

      oldImageUrl =
        "";


      form.reset();


      imagePreview.src =
        "";

      imagePreview.style.display =
        "none";


      document.getElementById(
        "formTitle"
      ).textContent =
        "➕ Add New Product";


      document.getElementById(
        "saveButton"
      ).textContent =
        "Add Product";


      document.getElementById(
        "cancelButton"
      ).style.display =
        "none";

    }


    /* =========================
       CANCEL EDIT
    ========================= */

    document
      .getElementById(
        "cancelButton"
      )
      .addEventListener(
        "click",
        resetForm
      );


    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
</html>
