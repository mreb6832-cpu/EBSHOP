<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d4af37;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>E&B SHOP</h1>

    <p class="subtitle">
      Create your new password
    </p>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="updateButton">
        Update Password
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="login.html">
      Back to Login
    </a>

  </div>


  <script type="module">

    import { supabase } from "./supabaseClient.js";


    const form = document.getElementById("resetForm");

    const message = document.getElementById("message");

    const updateButton =
      document.getElementById("updateButton");


    let recoveryReady = false;


    function showMessage(text, color = "#ccc") {

      message.textContent = text;

      message.style.color = color;

    }


    /*
      Supabase password recovery

      When the user opens the reset link from email,
      Supabase sends a PASSWORD_RECOVERY event.
    */

    supabase.auth.onAuthStateChange((event, session) => {

      if (event === "PASSWORD_RECOVERY" && session) {

        recoveryReady = true;

        showMessage(
          "Recovery link verified. You can now create a new password.",
          "#4ade80"
        );

      }

    });


    /*
      Check whether Supabase already restored
      the recovery session.
    */

    const { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();


    if (sessionError) {

      console.error(
        "Session error:",
        sessionError
      );

    }


    if (sessionData?.session) {

      recoveryReady = true;

    }


    /*
      Update password
    */

    form.addEventListener("submit", async (e) => {

      e.preventDefault();


      const password =
        document.getElementById("password").value.trim();


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value
          .trim();


      /*
        Check passwords
      */

      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "#ff6b6b"
        );

        return;

      }


      /*
        Minimum password length
      */

      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "#ff6b6b"
        );

        return;

      }


      /*
        Make sure recovery session exists
      */

      if (!recoveryReady) {

        showMessage(
          "Please open the password reset link from your email first.",
          "#ff6b6b"
        );

        return;

      }


      /*
        Disable button while updating
      */

      updateButton.disabled = true;

      updateButton.textContent =
        "Updating...";


      showMessage(
        "Updating password...",
        "#ccc"
      );


      /*
        Update Supabase password
      */

      const { error } =
        await supabase.auth.updateUser({

          password: password

        });


      /*
        Handle error
      */

      if (error) {

        console.error(
          "Password update error:",
          error
        );


        showMessage(
          error.message,
          "#ff6b6b"
        );


        updateButton.disabled = false;

        updateButton.textContent =
          "Update Password";

        return;

      }


      /*
        Success
      */

      showMessage(
        "Password updated successfully! You can now log in.",
        "#4ade80"
      );


      form.reset();


      /*
        Sign out recovery session
      */

      await supabase.auth.signOut();


      /*
        Return to login
      */

      setTimeout(() => {

        window.location.href =
          "login.html";

      }, 2000);

    });

  </script>

</body>
</html>
