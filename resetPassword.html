<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>E&B SHOP</h1>

    <p class="subtitle">
      Create your new password
    </p>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button type="submit">
        Update Password
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="login.html">
      Back to Login
    </a>
  </div>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "#ff6b6b";
        return;
      }

      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        message.style.color = "#ff6b6b";
        return;
      }

      message.textContent = "Updating password...";
      message.style.color = "#ccc";

      const { error } =
        await supabase.auth.updateUser({
          password: password
        });

      if (error) {
        message.textContent = error.message;
        message.style.color = "#ff6b6b";
        return;
      }

      message.textContent =
        "Password updated successfully! You can now log in.";

      message.style.color = "#4ade80";

      form.reset();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>

</body>
</html>
