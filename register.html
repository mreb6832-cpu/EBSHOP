<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | E&B SHOP</title>

  <meta
    name="description"
    content="Create your E&B SHOP account and start shopping."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .register-container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .logo span {
      color: #f5b82e;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    .card h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .card .subtitle {
      color: #999;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #1b1b1b;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #f5b82e;
    }

    .register-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 9px;
      background: #f5b82e;
      color: #080808;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    .register-btn:hover {
      background: #ffd76a;
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #12351d;
      border: 1px solid #286b3a;
      color: #8ff0a4;
    }

    .error {
      display: block;
      background: #351212;
      border: 1px solid #722626;
      color: #ff9c9c;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #999;
    }

    .login-link a {
      color: #f5b82e;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
    }

    .back-home:hover,
    .login-link a:hover {
      color: #ffd76a;
    }

    @media (max-width: 500px) {
      .card {
        padding: 22px;
      }

      .card h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">
      🛒 E&B <span>SHOP</span>
    </div>

    <div class="card">

      <h1>Create Account</h1>

      <p class="subtitle">
        Create your E&B SHOP account and start shopping.
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Full Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>

          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <button
          type="submit"
          class="register-btn"
          id="registerBtn"
        >
          Create Account
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <a href="index.html" class="back-home">
        ← Back to E&B SHOP
      </a>

    </div>

  </div>


  <script type="module">

    import { supabase } from "./supabaseClient.js";


    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const registerBtn =
      document.getElementById("registerBtn");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      hideMessage();


      if (!name || !email || !phone || !password || !confirmPassword) {

        showMessage(
          "Please complete all fields.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      registerBtn.disabled = true;

      registerBtn.textContent =
        "Creating Account...";


      try {

        /*
          Create account using Supabase Auth
        */

        const { data, error } =
          await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name,
                phone: phone
              },

              emailRedirectTo:
                "https://ebshop.vercel.app/account.html"

            }

          });


        if (error) {
          throw error;
        }


        /*
          Save basic customer information locally
          only for the website interface.

          Password is NEVER saved here.
        */

        localStorage.setItem(
          "ebShopCustomerEmail",
          email
        );

        localStorage.setItem(
          "ebShopCustomerName",
          name
        );

        localStorage.setItem(
          "ebShopCustomerPhone",
          phone
        );


        /*
          If Supabase immediately creates a session,
          go directly to account.
        */

        if (data && data.session) {

          showMessage(
            "Account created successfully! Opening your account...",
            "success"
          );

          setTimeout(function() {

            window.location.href =
              "account.html";

          }, 1000);

          return;
        }


        /*
          If email confirmation is enabled,
          the user must confirm their email first.
        */

        showMessage(
          "Account created successfully. Please check your email and confirm your account before logging in.",
          "success"
        );


        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Account";


      } catch (error) {

        console.error(
          "Registration error:",
          error
        );


        let errorMessage =
          error.message ||
          "Unable to create your account.";


        if (
          errorMessage.toLowerCase().includes("already registered")
        ) {

          errorMessage =
            "This email is already registered. Please login instead.";

        }


        showMessage(
          errorMessage,
          "error"
        );


        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Account";

      }

    });


    function showMessage(text, type) {

      message.textContent =
        text;

      message.className =
        "message " + type;

    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }

  </script>

</body>
</html>
