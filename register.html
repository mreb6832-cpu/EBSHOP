<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | E&B SHOP</title>

  <meta
    name="description"
    content="Create your E&B SHOP account and start shopping."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .register-container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .logo span {
      color: #f5b82e;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    .card h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .card .subtitle {
      color: #999;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #1b1b1b;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #f5b82e;
    }

    .register-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 9px;
      background: #f5b82e;
      color: #080808;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #ffd76a;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #12351d;
      border: 1px solid #286b3a;
      color: #8ff0a4;
    }

    .error {
      display: block;
      background: #351212;
      border: 1px solid #722626;
      color: #ff9c9c;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #999;
    }

    .login-link a {
      color: #f5b82e;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
    }

    .back-home:hover,
    .login-link a:hover {
      color: #ffd76a;
    }

    @media (max-width: 500px) {
      .card {
        padding: 22px;
      }

      .card h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">
      🛒 E&B <span>SHOP</span>
    </div>

    <div class="card">

      <h1>Create Account</h1>

      <p class="subtitle">
        Create your E&B SHOP account and start shopping.
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            required
          >
        </div>

        <button type="submit" class="register-btn">
          Create Account
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <a href="index.html" class="back-home">
        ← Back to E&B SHOP
      </a>

    </div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    const USERS_KEY = "ebShopUsers";

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.className = "message";
      message.textContent = "";

      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }

      let users = [];

      try {
        users = JSON.parse(
          localStorage.getItem(USERS_KEY)
        ) || [];
      } catch (error) {
        users = [];
      }

      if (!Array.isArray(users)) {
        users = [];
      }

      const existingUser = users.find(
        user => String(user.email).toLowerCase() === email
      );

      if (existingUser) {
        showMessage(
          "An account with this email already exists. Please login.",
          "error"
        );
        return;
      }

      const newUser = {
        id: Date.now(),
        name: name,
        email: email,
        phone: phone,
        password: password,
        createdAt: new Date().toISOString()
      };

      users.push(newUser);

      localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
      );

      /*
        Save the currently logged-in customer.
        This also allows the Owner Admin button
        to recognize the Owner email.
      */

      localStorage.setItem(
        "ebShopCustomerEmail",
        email
      );

      localStorage.setItem(
        "ebShopCustomerName",
        name
      );

      localStorage.setItem(
        "ebShopCustomerPhone",
        phone
      );

      localStorage.setItem(
        "ebShopLoggedIn",
        "true"
      );

      showMessage(
        "Account created successfully! Redirecting to your account...",
        "success"
      );

      setTimeout(function() {
        window.location.href = "account.html";
      }, 1200);

    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }
  </script>

</body>
</html>
