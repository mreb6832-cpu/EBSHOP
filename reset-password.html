<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
      border: 1px solid #292929;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .logo span {
      color: #f5b82e;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #f5b82e;
      box-shadow: 0 0 0 3px rgba(245,184,46,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #f5b82e;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #ffd76a;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #f5b82e;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #ffd76a;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      E&B <span>SHOP</span>
    </div>

    <p class="subtitle">
      Create your new password
    </p>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="submit"
        id="updateButton"
      >
        Update Password
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="login.html">
      ← Back to Login
    </a>

  </div>


  <script type="module">

    import { supabase } from "./supabaseClient.js";


    const form =
      document.getElementById("resetForm");

    const message =
      document.getElementById("message");

    const updateButton =
      document.getElementById("updateButton");


    let recoveryReady = false;


    function showMessage(text, color) {

      message.textContent = text;

      message.style.color =
        color || "#ccc";

    }


    /*
      Supabase sends PASSWORD_RECOVERY
      when the recovery link is opened.
    */

    const {
      data: authListener
    } =
      supabase.auth.onAuthStateChange(
        async (event, session) => {

          console.log(
            "Supabase auth event:",
            event
          );


          if (
            event === "PASSWORD_RECOVERY" &&
            session
          ) {

            recoveryReady = true;

            showMessage(
              "Recovery link verified. You can now create a new password.",
              "#4ade80"
            );

          }

        }
      );


    /*
      Check existing session.
    */

    try {

      const {
        data,
        error
      } =
        await supabase.auth.getSession();


      if (error) {

        console.error(
          "Session error:",
          error
        );

      }


      if (data?.session) {

        recoveryReady = true;

        showMessage(
          "Recovery link verified. You can now create a new password.",
          "#4ade80"
        );

      }

    } catch (error) {

      console.error(
        "Recovery session error:",
        error
      );

    }


    /*
      Update password.
    */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        /*
          Validate password.
        */

        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "#ff6b6b"
          );

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "#ff6b6b"
          );

          return;

        }


        /*
          Make sure the recovery session exists.
        */

        if (!recoveryReady) {

          showMessage(
            "Please open the password reset link from your email first.",
            "#ff6b6b"
          );

          return;

        }


        updateButton.disabled = true;

        updateButton.textContent =
          "Updating...";


        showMessage(
          "Updating password...",
          "#ccc"
        );


        try {

          const {
            error
          } =
            await supabase.auth.updateUser({

              password: password

            });


          if (error) {
            throw error;
          }


          showMessage(
            "Password updated successfully! Redirecting to login...",
            "#4ade80"
          );


          form.reset();


          /*
            End the recovery session.
          */

          await supabase.auth.signOut();


          setTimeout(function() {

            window.location.href =
              "login.html";

          }, 1800);


        } catch (error) {

          console.error(
            "Password update error:",
            error
          );


          showMessage(
            error.message ||
            "Unable to update your password.",
            "#ff6b6b"
          );


          updateButton.disabled = false;

          updateButton.textContent =
            "Update Password";

        }

      }
    );

  </script>

</body>
</html>
