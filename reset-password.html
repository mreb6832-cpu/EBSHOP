<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password — E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: min(450px, 100%);
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }

    .icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fff7df;
      border: 1px solid #f0cd75;
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 49px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #f5b82e;
      box-shadow: 0 0 0 3px rgba(245,184,46,.12);
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 9px;
      background: #f5b82e;
      color: #000;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #ffd76a;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a00000;
      border: 1px solid #ffcaca;
    }

    .message.success {
      display: block;
      background: #effbea;
      color: #267326;
      border: 1px solid #c8e9c8;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #9a700e;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 500px) {
      .box {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="icon">
      🔐
    </div>

    <h1>Reset Password</h1>

    <p class="subtitle">
      Enter your new password for your E&B SHOP account.
    </p>

    <div id="message" class="message"></div>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button type="submit">
        Update Password
      </button>

    </form>

    <a href="login.html" class="back">
      ← Back to Login
    </a>

  </div>

  <script type="module">

    import {
      supabase
    } from "./supabaseClient.js";

    const form =
      document.getElementById("resetForm");

    const message =
      document.getElementById("message");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.className = "message";
      message.textContent = "";

      if (password.length < 6) {

        message.className = "message error";

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }

      if (password !== confirmPassword) {

        message.className = "message error";

        message.textContent =
          "Passwords do not match.";

        return;
      }

      try {

        const { error } =
          await supabase.auth.updateUser({
            password: password
          });

        if (error) {
          throw error;
        }

        message.className =
          "message success";

        message.textContent =
          "Password updated successfully. Redirecting to login...";

        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 2000);

      } catch (error) {

        message.className =
          "message error";

        message.textContent =
          error.message ||
          "Unable to update your password.";

      }

    });

  </script>

</body>
</html>
